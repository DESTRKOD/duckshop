<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ожидание подтверждения | Duck Shop</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0b3c91 0%, #1e2a6e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 32px 24px;
            text-align: center;
        }

        .animation-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
        }

        .title {
            color: white;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .message {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="animation-container" id="lottie-animation"></div>
    <div class="title">Ожидание подтверждения</div>
    <div class="message">Ожидайте, когда администратор проверит платеж.</div>
    <div class="message" style="margin-top: 12px; font-size: 14px; opacity: 0.7;">Страница обновится автоматически</div>
</div>

<script>
    lottie.loadAnimation({
        container: document.getElementById('lottie-animation'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: 'waitinggood.json'
    });
    
    // Получаем номер заказа из URL
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('order');
    
    if (orderId) {
        // Периодически проверяем статус заказа
        const checkInterval = setInterval(async () => {
            try {
                const response = await fetch(`/api/order-status/${orderId}`);
                const data = await response.json();
                
                if (data.success) {
                    // Если заказ завершен (оплата подтверждена)
                    if (data.status === 'completed' || data.paymentStatus === 'confirmed') {
                        clearInterval(checkInterval);
                        window.location.href = '/success.html';
                    }
                    // Если заказ отменен или проблемы
                    if (data.status === 'canceled') {
                        clearInterval(checkInterval);
                        window.location.href = '/badpay.html';
                    }
                }
            } catch (error) {
                console.error('Ошибка проверки статуса:', error);
            }
        }, 5000); // Проверяем каждые 5 секунд
    }
</script>
</body>
</html>
