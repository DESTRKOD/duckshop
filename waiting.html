<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ожидание подтверждения | Duck Shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/png" href="https://i.imgur.com/S4nWZZp.png">
    <link rel="shortcut icon" type="image/png" href="https://i.imgur.com/S4nWZZp.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/YOUhVyG.png">
    <meta name="theme-color" content="#0b3c91">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #0b3c91 0%, #1565c0 55%, #42a5f5 100%);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 32px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .sticker {
            width: 220px;
            height: 220px;
            margin: 0 auto 24px;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            color: white;
            margin-bottom: 16px;
        }

        .message {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .order-number {
            font-size: 16px;
            font-weight: 600;
            color: #ffd966;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 40px;
            display: inline-block;
            margin-top: 16px;
        }

        .small-note {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 24px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 16px;
            }
            .sticker {
                width: 160px;
                height: 160px;
            }
            .title {
                font-size: 24px;
            }
            .message {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="sticker" id="lottie-animation"></div>
    <div class="title">Ожидание подтверждения</div>
    <div class="message">Ожидайте, когда администратор проверит платеж.</div>
    <div class="order-number" id="orderNumber"></div>
    <div class="small-note">Страница обновится автоматически</div>
</div>

<script>
    lottie.loadAnimation({
        container: document.getElementById('lottie-animation'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: 'waitinggood.json'
    });
    
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('order');
    
    if (orderId) {
        document.getElementById('orderNumber').innerText = `Заказ #${orderId}`;
        
        let checkCount = 0;
        const checkInterval = setInterval(async () => {
            checkCount++;
            try {
                const response = await fetch(`/api/order-status/${orderId}`);
                const data = await response.json();
                
                if (data.success) {
                    if (data.status === 'completed' || data.paymentStatus === 'confirmed') {
                        clearInterval(checkInterval);
                        window.location.href = '/success.html';
                    }
                    if (data.status === 'payment_failed' || data.status === 'canceled') {
                        clearInterval(checkInterval);
                        window.location.href = '/badpay.html';
                    }
                }
                
                if (checkCount > 120) {
                    clearInterval(checkInterval);
                }
            } catch (error) {
                console.error('Ошибка проверки статуса:', error);
            }
        }, 5000);
    }
</script>
</body>
</html>
