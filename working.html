<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Технический перерыв - Duck Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #0b3c91 0%, #1565c0 55%, #42a5f5 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    
    .container {
      max-width: 500px;
      width: 100%;
      text-align: center;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 32px;
      padding: 30px 20px;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      position: relative;
    }
    
    .time-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 30px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      color: white;
      backdrop-filter: blur(5px);
    }
    
    .sticker {
      width: 200px;
      height: 200px;
      margin: 0 auto 20px;
    }
    
    .title {
      font-size: 28px;
      font-weight: 800;
      color: white;
      margin-bottom: 16px;
    }
    
    .text {
      font-size: 16px;
      color: rgba(255,255,255,0.9);
      margin-bottom: 30px;
      line-height: 1.5;
    }
    
    .button {
      display: inline-block;
      padding: 16px 40px;
      background: white;
      color: #0b3c91;
      text-decoration: none;
      border-radius: 18px;
      font-weight: 800;
      font-size: 18px;
      transition: transform 0.15s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: none;
      cursor: pointer;
    }
    
    .button:hover {
      transform: translateY(-2px);
    }
    
    .button:active {
      transform: translateY(1px);
    }
    
    .info-text {
      margin-top: 20px;
      font-size: 14px;
      color: rgba(255,255,255,0.6);
    }
    
    .admin-note {
      margin-top: 15px;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
    }
    
    @media (max-width: 480px) {
      .sticker {
        width: 160px;
        height: 160px;
      }
      .title {
        font-size: 24px;
      }
      .text {
        font-size: 15px;
      }
      .button {
        padding: 14px 32px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="time-badge" id="timeBadge">Скоро...</div>
    
    <div class="sticker" id="maintenanceAnim"></div>
    
    <div class="title">Технический перерыв</div>
    <div class="text">
      На нашем сайте ведутся технические работы.<br>
      Пожалуйста, подождите, скоро всё заработает!
    </div>
    
    <button class="button" id="retryBtn">Попробовать снова</button>
    
    <div class="admin-note" id="adminNote" style="display: none;">🔑 Режим администратора активирован</div>
  </div>
  
  <script>
    const API_URL = 'https://duck-shop-sever.onrender.com';
    
    function checkAdminBypass() {
      const urlParams = new URLSearchParams(window.location.search);
      const adminBypass = urlParams.get('admin_bypass');
      
      if (adminBypass) {
        console.log('🔑 Обнаружен admin_bypass на working.html, редирект на главную');
        const redirectUrl = 'https://shopdxs.ru/?' + urlParams.toString();
        window.location.href = redirectUrl;
        return true;
      }
      return false;
    }
    
    function formatTimeToMSK(date) {
      return date.toLocaleTimeString('ru-RU', { 
        timeZone: 'Europe/Moscow',
        hour: '2-digit', 
        minute: '2-digit',
        hour12: false 
      });
    }
    
    async function updateMaintenanceInfo() {
      try {
        const response = await fetch(`${API_URL}/api/maintenance-status`);
        const data = await response.json();
        
        const timeBadge = document.getElementById('timeBadge');
        
        if (data.maintenance) {
          if (data.endTime) {
            const now = new Date();
            const endTime = new Date(data.endTime);
            
            if (now > endTime) {
              timeBadge.textContent = 'Скоро...';
            } else {
              const endTimeMSK = formatTimeToMSK(endTime);
              timeBadge.textContent = `до ${endTimeMSK} МСК`;
            }
          } else {
            timeBadge.textContent = 'Скоро...';
          }
        } else {
          window.location.href = 'https://shopdxs.ru/';
        }
      } catch (error) {
        console.error('Ошибка получения статуса:', error);
      }
    }
    
    if (!checkAdminBypass()) {
      lottie.loadAnimation({
        container: document.getElementById('maintenanceAnim'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: 'working.json'
      });
      
      updateMaintenanceInfo();
      setInterval(updateMaintenanceInfo, 30000);
      
      document.getElementById('retryBtn').addEventListener('click', () => {
        window.location.reload();
      });
    }
  </script>
</body>
</html>
