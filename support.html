<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Поддержка - Duck Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #0b3c91 0%, #1565c0 55%, #42a5f5 100%);
      color: white;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
    }

    /* Desktop styles - полное расширение */
    @media (min-width: 1024px) {
      .chat-container {
        max-width: 800px;
        height: 90vh;
        margin: 20px auto;
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      }
    }

    .chat-header {
      padding: 16px 20px;
      background: rgba(11, 60, 145, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }

    .back-button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.18s;
      flex-shrink: 0;
    }

    .back-button:hover {
      background: rgba(255,255,255,0.28);
    }

    .back-button svg {
      width: 24px;
      height: 24px;
      fill: white;
    }

    .support-info {
      flex: 1;
    }

    .support-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .support-status {
      font-size: 14px;
      color: #c3dfff;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4caf50;
      box-shadow: 0 0 0 3px rgba(76,175,80,0.35);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message-wrapper {
      display: flex;
      width: 100%;
    }

    .message-wrapper.user {
      justify-content: flex-end;
    }

    .message-wrapper.support {
      justify-content: flex-start;
    }

    .message-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffb300;
      color: #0d47a1;
      font-weight: bold;
      font-size: 18px;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .message-avatar.user {
      margin-left: 10px;
    }

    .message-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .message-content {
      max-width: 70%;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 1024px) {
      .message-content {
        max-width: 60%;
      }
    }

    .message-bubble {
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.5;
      word-break: break-word;
      overflow-wrap: break-word;
      white-space: pre-wrap;
      width: fit-content;
      max-width: 100%;
    }

    .message-wrapper.user .message-bubble {
      background: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%);
      color: white;
      border-bottom-right-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      margin-left: auto;
    }

    .message-wrapper.support .message-bubble {
      background: rgba(255,255,255,0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.18);
      color: white;
      border-bottom-left-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      margin-right: auto;
    }

    .message-time {
      font-size: 11px;
      margin-top: 6px;
      opacity: 0.7;
      text-align: right;
      padding-right: 4px;
    }

    .chat-input-area {
      padding: 16px 20px;
      background: rgba(11,60,145,0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .attach-button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,255,255,0.14);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .attach-button:hover {
      background: rgba(255,255,255,0.24);
    }

    .attach-button svg {
      fill: white;
      width: 24px;
      height: 24px;
    }

    .input-wrapper {
      flex: 1;
      background: rgba(255,255,255,0.13);
      border-radius: 28px;
      padding: 10px 18px;
      border: 1px solid rgba(255,255,255,0.18);
      transition: all 0.2s;
    }

    .input-wrapper:focus-within {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.35);
    }

    .chat-input {
      width: 100%;
      background: transparent;
      border: none;
      color: white;
      font-size: 16px;
      outline: none;
      min-height: 24px;
      max-height: 120px;
      resize: none;
      line-height: 1.5;
      font-family: inherit;
    }

    .chat-input::placeholder {
      color: rgba(255,255,255,0.58);
    }

    .send-button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #2196f3;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.18s;
      flex-shrink: 0;
    }

    .send-button:hover {
      background: #1976d2;
      transform: scale(1.07);
    }

    .send-button:disabled {
      background: rgba(255,255,255,0.18);
      cursor: not-allowed;
      transform: none;
    }

    .send-button svg {
      fill: white;
      width: 22px;
      height: 22px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .empty-state-text {
      color: rgba(255,255,255,0.9);
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .empty-state-subtext {
      color: rgba(255,255,255,0.7);
      font-size: 15px;
    }

    .lottie-container {
      width: 240px;
      height: 240px;
      margin-bottom: 24px;
    }

    .loading-indicator {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .file-message {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .file-icon {
      font-size: 22px;
    }

    .file-link {
      color: white;
      text-decoration: underline;
      text-underline-offset: 2px;
      word-break: break-all;
      font-size: 14px;
    }

    .image-preview {
      max-width: 100%;
      max-height: 300px;
      border-radius: 12px;
      display: block;
      margin-top: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .image-preview:hover {
      transform: scale(1.02);
    }

    .image-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: pointer;
    }

    .image-modal img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 8px;
    }

    @media (max-width: 480px) {
      .chat-header { padding: 12px 16px; }
      .chat-messages { padding: 16px 12px; }
      .chat-input-area { padding: 12px 16px; gap: 8px; }
      .message-content { max-width: 80%; }
      .attach-button { width: 44px; height: 44px; }
      .send-button { width: 44px; height: 44px; }
      .lottie-container { width: 200px; height: 200px; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <button class="back-button" id="backButton">
        <svg viewBox="0 0 24 24">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="white"/>
        </svg>
      </button>

      <div class="support-info">
        <div class="support-name">Поддержка Duck Shop</div>
        <div class="support-status">
          <span class="status-dot"></span>
          в сети
        </div>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input-area">
      <button class="attach-button" id="attachButton" type="button">
        <svg viewBox="0 0 24 24">
          <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
        </svg>
      </button>

      <input type="file" id="fileInput" style="display:none;" accept="image/*,.pdf,.txt,.doc,.docx"/>

      <div class="input-wrapper">
        <textarea 
          id="messageInput" 
          class="chat-input" 
          placeholder="Напишите сообщение..." 
          rows="1"
        ></textarea>
      </div>

      <button class="send-button" id="sendButton" disabled>
        <svg viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const API_URL = 'https://duck-shop-sever.onrender.com';

    let currentUser = null;
    let currentDialogId = null;
    let lastMessageId = 0;
    let messageCheckInterval = null;
    let lottieAnimation = null;

    function loadUser() {
      try {
        const userData = localStorage.getItem('duck_user_v1');
        return userData ? JSON.parse(userData) : null;
      } catch (e) {
        console.error('Error loading user:', e);
        return null;
      }
    }

    function formatTime(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function isImageFile(fileName) {
      const ext = fileName.split('.').pop().toLowerCase();
      return ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'].includes(ext);
    }

    function openImageModal(imageUrl) {
      const modal = document.createElement('div');
      modal.className = 'image-modal';
      modal.innerHTML = `<img src="${imageUrl}" alt="Full size">`;
      modal.onclick = () => modal.remove();
      document.body.appendChild(modal);
    }

    function showLoadingState() {
      const messagesContainer = document.getElementById('chatMessages');
      messagesContainer.innerHTML = `
        <div class="loading-indicator">
          <div class="lottie-container" id="lottieAnimation"></div>
          <div style="color: rgba(255,255,255,0.9); font-size: 18px; font-weight: 500;">Загрузка сообщений...</div>
        </div>
      `;
      
      if (typeof lottie !== 'undefined') {
        lottieAnimation = lottie.loadAnimation({
          container: document.getElementById('lottieAnimation'),
          renderer: 'svg',
          loop: true,
          autoplay: true,
          path: 'support.json'
        });
      }
    }

    function showEmptyState() {
      const messagesContainer = document.getElementById('chatMessages');
      messagesContainer.innerHTML = `
        <div class="empty-state">
          <div class="lottie-container" id="emptyLottie"></div>
          <div class="empty-state-text">Чат с поддержкой</div>
          <div class="empty-state-subtext">Напишите нам — ответим быстро</div>
        </div>
      `;
      
      if (typeof lottie !== 'undefined') {
        lottieAnimation = lottie.loadAnimation({
          container: document.getElementById('emptyLottie'),
          renderer: 'svg',
          loop: true,
          autoplay: true,
          path: 'support.json'
        });
      }
    }

    async function sendMessage(text = null, file = null) {
      if (!currentUser) return;

      try {
        let body;
        let headers = {};

        if (file) {
          body = new FormData();
          body.append('file', file);
          body.append('user_id', currentUser.id);
          if (currentDialogId) body.append('dialog_id', currentDialogId);
        } else if (text && text.trim()) {
          body = JSON.stringify({
            user_id: currentUser.id,
            message: text.trim(),
            dialog_id: currentDialogId
          });
          headers = { 'Content-Type': 'application/json' };
        } else {
          return;
        }

        const response = await fetch(`${API_URL}/api/support/message`, {
          method: 'POST',
          headers,
          body
        });

        if (!response.ok) {
          console.warn('Server returned non-OK status, but message might still be sent');
        }

        const data = await response.json().catch(() => ({}));

        if (!currentDialogId && data.dialog_id) {
          currentDialogId = data.dialog_id;
        }

        if (text) {
          const messageInput = document.getElementById('messageInput');
          if (messageInput) {
            messageInput.value = '';
            messageInput.style.height = 'auto';
          }
          const sendButton = document.getElementById('sendButton');
          if (sendButton) {
            sendButton.disabled = true;
          }
        }
        
        const fileInput = document.getElementById('fileInput');
        if (fileInput) {
          fileInput.value = '';
        }

        await loadMessageHistory();
      } catch (error) {
        console.error('Error sending message:', error);
        // Не показываем ошибку пользователю, просто логируем
      }
    }

    async function loadMessageHistory() {
      if (!currentUser) return;

      try {
        const response = await fetch(`${API_URL}/api/support/history/${currentUser.id}`);
        const data = await response.json();

        if (data.success) {
          if (data.messages.length > 0) {
            currentDialogId = data.dialog_id;
            
            let lastId = 0;
            const messagesHtml = data.messages.map(msg => {
              lastId = Math.max(lastId, msg.id);
              const isUser = msg.sender === 'user';
              
              let messageContent = '';
              
              if (msg.metadata && msg.metadata.file) {
                const file = msg.metadata.file;
                const isImage = isImageFile(file.name);
                
                if (isImage) {
                  messageContent = `
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                      <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 18px;">🖼️</span>
                        <span style="font-size: 14px; opacity: 0.9;">${file.name}</span>
                      </div>
                      <img src="${file.url}" alt="${file.name}" class="image-preview" onclick="openImageModal('${file.url}')">
                    </div>
                  `;
                } else {
                  messageContent = `
                    <div class="file-message">
                      <span class="file-icon">📎</span>
                      <a href="${file.url}" target="_blank" class="file-link">${file.name}</a>
                    </div>
                  `;
                }
              } else {
                messageContent = (msg.message || '').replace(/\n/g, '<br>');
              }
              
              return `
                <div class="message-wrapper ${isUser ? 'user' : 'support'}">
                  <div class="message-content">
                    <div class="message-bubble">
                      ${messageContent}
                      <div class="message-time">${formatTime(msg.created_at)}</div>
                    </div>
                  </div>
                  ${isUser && currentUser.avatarUrl ? 
                    `<div class="message-avatar user"><img src="${currentUser.avatarUrl}" alt="You"></div>` : 
                    isUser ? `<div class="message-avatar user"><span>${(currentUser.username || 'U').charAt(0).toUpperCase()}</span></div>` : ''
                  }
                </div>
              `;
            }).join('');
            
            document.getElementById('chatMessages').innerHTML = messagesHtml;
            lastMessageId = lastId;
            
            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
          } else {
            showEmptyState();
          }
        }
      } catch (error) {
        console.error('Error loading history:', error);
        showEmptyState();
      }
    }

    async function checkNewMessages() {
      if (!currentUser || !currentDialogId) return;

      try {
        const response = await fetch(`${API_URL}/api/support/new/${currentUser.id}/${lastMessageId}`);
        const data = await response.json();

        if (data.success && data.messages.length > 0) {
          const messagesContainer = document.getElementById('chatMessages');
          
          // Удаляем empty state если он есть
          const emptyState = messagesContainer.querySelector('.empty-state');
          if (emptyState) {
            messagesContainer.innerHTML = '';
          }
          
          data.messages.forEach(msg => {
            lastMessageId = Math.max(lastMessageId, msg.id);
            const isUser = msg.sender === 'user';
            
            let messageContent = '';
            
            if (msg.metadata && msg.metadata.file) {
              const file = msg.metadata.file;
              const isImage = isImageFile(file.name);
              
              if (isImage) {
                messageContent = `
                  <div style="display: flex; flex-direction: column; gap: 8px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                      <span style="font-size: 18px;">🖼️</span>
                      <span style="font-size: 14px; opacity: 0.9;">${file.name}</span>
                    </div>
                    <img src="${file.url}" alt="${file.name}" class="image-preview" onclick="openImageModal('${file.url}')">
                  </div>
                `;
              } else {
                messageContent = `
                  <div class="file-message">
                    <span class="file-icon">📎</span>
                    <a href="${file.url}" target="_blank" class="file-link">${file.name}</a>
                  </div>
                `;
              }
            } else {
              messageContent = (msg.message || '').replace(/\n/g, '<br>');
            }
            
            const messageHtml = `
              <div class="message-wrapper ${isUser ? 'user' : 'support'}">
                <div class="message-content">
                  <div class="message-bubble">
                    ${messageContent}
                    <div class="message-time">${formatTime(msg.created_at)}</div>
                  </div>
                </div>
                ${isUser && currentUser.avatarUrl ? 
                  `<div class="message-avatar user"><img src="${currentUser.avatarUrl}" alt="You"></div>` : 
                  isUser ? `<div class="message-avatar user"><span>${(currentUser.username || 'U').charAt(0).toUpperCase()}</span></div>` : ''
                }
              </div>
            `;
            
            messagesContainer.insertAdjacentHTML('beforeend', messageHtml);
          });
          
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
      } catch (error) {
        console.error('Error checking new messages:', error);
      }
    }

    function autoResizeTextarea() {
      const textarea = document.getElementById('messageInput');
      if (!textarea) return;
      
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
      
      const sendButton = document.getElementById('sendButton');
      if (sendButton) {
        sendButton.disabled = !textarea.value.trim();
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      currentUser = loadUser();
      
      if (!currentUser) {
        window.location.href = 'reg_log.html';
        return;
      }

      // Показываем загрузку
      showLoadingState();

      await loadMessageHistory();

      if (currentDialogId) {
        messageCheckInterval = setInterval(checkNewMessages, 3000);
      }

      const messageInput = document.getElementById('messageInput');
      const sendButton = document.getElementById('sendButton');
      const backButton = document.getElementById('backButton');
      const attachButton = document.getElementById('attachButton');
      const fileInput = document.getElementById('fileInput');

      if (messageInput) {
        messageInput.addEventListener('input', autoResizeTextarea);
        
        messageInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (messageInput.value.trim()) {
              sendMessage(messageInput.value);
            }
          }
        });
      }

      if (sendButton) {
        sendButton.addEventListener('click', () => {
          if (messageInput && messageInput.value.trim()) {
            sendMessage(messageInput.value);
          }
        });
      }

      if (attachButton) {
        attachButton.addEventListener('click', () => {
          if (fileInput) fileInput.click();
        });
      }

      if (fileInput) {
        fileInput.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;

          if (file.size > 10 * 1024 * 1024) {
            alert('Файл слишком большой (максимум 10 МБ)');
            return;
          }

          sendMessage(null, file);
        });
      }

      if (backButton) {
        backButton.addEventListener('click', () => {
          window.location.href = 'main.html';
        });
      }
    });

    window.addEventListener('beforeunload', () => {
      if (messageCheckInterval) {
        clearInterval(messageCheckInterval);
      }
      if (lottieAnimation) {
        lottieAnimation.destroy();
      }
    });
  </script>
</body>
</html>
