<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Поддержка - Duck Shop</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            height:100%;
            margin:0;
            overflow:hidden;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
            background:linear-gradient(180deg,#0b3c91 0%,#1565c0 55%,#42a5f5 100%);
            color:#fff;
            -webkit-text-size-adjust:100%;
        }
        .chat-container {
            display:flex;
            flex-direction:column;
            height:100%;
            min-height:-webkit-fill-available;
            background:transparent;
            overflow:hidden;
        }
        .chat-header {
            padding:10px 14px;
            background:rgba(11,60,145,0.98);
            backdrop-filter:blur(12px);
            display:flex;
            align-items:center;
            gap:10px;
            flex-shrink:0;
            border-bottom:1px solid rgba(255,255,255,0.12);
            z-index:10;
        }
        .back-button {
            width:34px; height:34px;
            border-radius:50%;
            background:rgba(255,255,255,0.15);
            border:none;
            display:flex; align-items:center; justify-content:center;
            cursor:pointer;
        }
        .back-button:hover { background:rgba(255,255,255,0.25); }
        .back-button svg { width:18px; height:18px; fill:#fff; }
        .support-info { flex:1; }
        .support-name { font-size:16px; font-weight:700; margin-bottom:1px; }
        .support-status { font-size:12px; color:#d0e0ff; display:flex; align-items:center; gap:5px; }
        .status-dot { width:7px; height:7px; border-radius:50%; background:#4caf50; box-shadow:0 0 0 2px rgba(76,175,80,0.4); }
        .chat-messages {
            flex:1;
            overflow-y:auto;
            padding:6px 6px;
            display:flex;
            flex-direction:column;
            gap:4px;
            scroll-behavior:smooth;
            -webkit-overflow-scrolling:touch;
        }
        .message-wrapper {
            display:flex;
            width:100%;
            align-items:flex-start;
            margin-bottom:2px;
        }
        .message-wrapper.user {
            justify-content:flex-end !important;
            flex-direction:row-reverse !important;
        }
        .message-wrapper.support {
            justify-content:flex-start !important;
        }
        .message-avatar {
            width:28px; height:28px;
            border-radius:50%;
            overflow:hidden;
            flex-shrink:0;
            margin:0 4px;
            border:1.5px solid rgba(255,255,255,0.18);
            background:#1e90ff;
            display:flex; align-items:center; justify-content:center;
            font-size:12px; font-weight:bold;
        }
        .message-avatar img { width:100%; height:100%; object-fit:cover; }
        .message-avatar.support { background:#4caf50; color:#fff; }
        .message-content {
            display:inline-block !important;
            max-width: fit-content !important;
            margin:0 !important;
            padding:0 !important;
        }
        .message-wrapper.user .message-content {
            margin-left:auto;
            margin-right:0;
        }
        .message-wrapper.support .message-content {
            margin-right:auto;
            margin-left:0;
        }
        .message-bubble {
            padding:6px 10px;
            font-size:14.5px;
            line-height:1.32;
            border-radius:16px;
            word-break:break-word;
            white-space:pre-wrap;
            text-align:left;
            display:inline-block;
            min-width:0;
        }
        .message-wrapper.user .message-bubble {
            background:linear-gradient(135deg,#1976d2 0%,#0d47a1 100%);
            color:#fff;
            border-bottom-right-radius:5px;
            border-bottom-left-radius:16px;
            box-shadow:0 1px 2px rgba(0,0,0,0.25);
            margin-left:auto;
            margin-right:0;
        }
        .message-wrapper.support .message-bubble {
            background:rgba(255,255,255,0.13);
            backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,0.1);
            color:#fff;
            border-bottom-left-radius:5px;
            border-bottom-right-radius:16px;
            box-shadow:0 1px 2px rgba(0,0,0,0.2);
            margin-right:auto;
            margin-left:0;
        }
        .message-time {
            font-size:10px;
            opacity:0.65;
            margin-top:2px;
            text-align:right;
            align-self:flex-end;
            white-space:nowrap;
        }
        .message-image {
            max-width:210px;
            border-radius:12px;
            margin:2px 0;
            display:block;
            cursor:pointer;
            box-shadow:0 2px 5px rgba(0,0,0,0.3);
        }
        .chat-input-area {
            padding:8px 12px;
            background:rgba(11,60,145,0.98);
            backdrop-filter:blur(12px);
            border-top:1px solid rgba(255,255,255,0.12);
            display:flex;
            align-items:center;
            gap:8px;
            flex-shrink:0;
            min-height:56px;
            padding-bottom:calc(env(safe-area-inset-bottom, 0) + 12px);
            box-sizing:border-box;
        }
        .chat-input-area.closed {
            justify-content:center;
            padding:12px;
        }
        .attach-button, .send-button {
            width:38px; height:38px;
            border-radius:50%;
            border:none;
            display:flex; align-items:center; justify-content:center;
            cursor:pointer;
        }
        .attach-button { background:rgba(255,255,255,0.14); }
        .attach-button:hover { background:rgba(255,255,255,0.22); }
        .attach-button svg, .send-button svg { width:20px; height:20px; fill:#fff; }
        .send-button { background:#2196f3; }
        .send-button:hover:not(:disabled) { background:#1976d2; transform:scale(1.08); }
        .send-button:disabled { background:rgba(255,255,255,0.16); cursor:not-allowed; }
        .input-wrapper {
            flex:1;
            background:rgba(255,255,255,0.12);
            border-radius:24px;
            padding:8px 14px;
            border:1px solid rgba(255,255,255,0.14);
            min-height:44px;
            display:flex;
            align-items:center;
        }
        .chat-input {
            width:100%;
            background:transparent;
            border:none;
            color:#fff;
            font-size:15px;
            outline:none;
            resize:none;
            line-height:1.4;
            padding:0;
        }
        .chat-input::placeholder { color:rgba(255,255,255,0.5); }
        .chat-input:disabled { opacity:0.5; }
        .empty-state {
            flex:1;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:20px;
        }
        .lottie-container {
            width:160px;
            height:160px;
            margin-bottom:12px;
        }
        .empty-state-text { font-size:18px; font-weight:600; margin-bottom:8px; }
        .empty-state-subtext { font-size:14px; opacity:0.8; }
        .image-modal {
            position:fixed; inset:0;
            background:rgba(0,0,0,0.96);
            display:flex; align-items:center; justify-content:center;
            z-index:1000;
            cursor:zoom-out;
        }
        .image-modal img {
            max-width:96%; max-height:96%;
            object-fit:contain;
            border-radius:8px;
        }
        /* Кнопка нового разговора */
        .new-chat-button {
            background:#2196f3;
            border:none;
            border-radius:40px;
            padding:12px 28px;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:12px;
            cursor:pointer;
            color:white;
            font-size:18px;
            font-weight:600;
            box-shadow:0 4px 15px rgba(0,0,0,0.3);
            transition:all 0.2s;
            max-width:280px;
            width:100%;
        }
        .new-chat-button:hover {
            background:#1976d2;
            transform:scale(1.02);
            box-shadow:0 6px 20px rgba(0,0,0,0.4);
        }
        .new-chat-button svg {
            width:24px;
            height:24px;
            fill:white;
        }
        /* Затемнение → Lottie → текст при закрытии диалога */
        .dialog-end-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, #000 70%);
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: opacity 2.4s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .dialog-end-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .end-lottie {
            width: 240px;
            height: 240px;
            margin-bottom: 32px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 1.4s ease-out 1s;
        }
        .dialog-end-overlay.active .end-lottie {
            opacity: 1;
            transform: scale(1);
        }
        .end-text {
            font-size: 24px;
            font-weight: 600;
            color: white;
            text-align: center;
            opacity: 0;
            transition: opacity 1.2s ease-out 2s;
        }
        .dialog-end-overlay.active .end-text {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <button class="back-button" id="backButton">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <div class="support-info">
                <div class="support-name">Поддержка Duck Shop</div>
                <div class="support-status">
                    <span class="status-dot"></span> в сети
                </div>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area" id="chatInputArea">
            <!-- Исходные элементы ввода -->
            <button class="attach-button" id="attachButton">
                <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
            </button>
            <input type="file" id="fileInput" accept="image/*" style="display:none;">
            <div class="input-wrapper">
                <textarea id="messageInput" class="chat-input" placeholder="Сообщение..." rows="1"></textarea>
            </div>
            <button class="send-button" id="sendButton" disabled>
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>
    <!-- Затемнение + анимация завершения -->
    <div class="dialog-end-overlay" id="endOverlay">
        <div class="end-lottie" id="endLottie"></div>
        <div class="end-text">Ваше обращение закрыто<br><span style="font-size:16px; opacity:0.8;">надеемся, мы решили все ваши вопросы</span></div>
    </div>

    <script>
        const API_URL = 'https://duck-shop-sever.onrender.com';
        let currentUser = null;
        let currentDialogId = null;
        let lastMessageId = 0;
        let pollingInterval = null;
        let isDialogClosed = false;

        function loadUser() {
            try {
                const data = localStorage.getItem('duck_user_v1');
                return data ? JSON.parse(data) : null;
            } catch {
                return null;
            }
        }

        function formatTime(ts) {
            const d = new Date(ts);
            return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        }

        function autoGrowTextarea() {
            const ta = document.getElementById('messageInput');
            if (!ta) return;
            ta.style.height = 'auto';
            ta.style.height = Math.min(ta.scrollHeight, 80) + 'px';
            document.getElementById('sendButton').disabled = !ta.value.trim();
        }

        function openFullImage(src) {
            const modal = document.createElement('div');
            modal.className = 'image-modal';
            modal.innerHTML = `<img src="${src}" alt="full image">`;
            modal.onclick = () => modal.remove();
            document.body.appendChild(modal);
        }

        // Функция для замены строки ввода на кнопку "Начать новый разговор"
        function showNewChatButton() {
            const inputArea = document.getElementById('chatInputArea');
            const attachBtn = document.getElementById('attachButton');
            const inputWrapper = document.querySelector('.input-wrapper');
            const sendBtn = document.getElementById('sendButton');
            
            // Скрываем старые элементы
            attachBtn.style.display = 'none';
            inputWrapper.style.display = 'none';
            sendBtn.style.display = 'none';
            
            // Добавляем класс для центрирования
            inputArea.classList.add('closed');
            
            // Создаем кнопку нового разговора, если её ещё нет
            if (!document.getElementById('newChatButton')) {
                const newChatBtn = document.createElement('button');
                newChatBtn.id = 'newChatButton';
                newChatBtn.className = 'new-chat-button';
                newChatBtn.innerHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                        <path d="M12 6v4h4v2h-4v4h-2v-4H6v-2h4V6h2z"/>
                    </svg>
                    Начать новый разговор
                `;
                newChatBtn.onclick = () => location.reload();
                inputArea.appendChild(newChatBtn);
            }
        }

        async function sendMessage(text = '', file = null) {
            if (!currentUser || isDialogClosed) return;
            const formData = new FormData();
            formData.append('user_id', currentUser.id);
            if (currentDialogId) formData.append('dialog_id', currentDialogId);
            if (file) formData.append('file', file);
            else if (text.trim()) formData.append('message', text.trim());
            else return;
            
            try {
                const resp = await fetch(`${API_URL}/api/support/message`, {
                    method: 'POST',
                    body: formData
                });
                const data = await resp.json();
                if (data.dialog_id) currentDialogId = data.dialog_id;
                document.getElementById('messageInput').value = '';
                document.getElementById('messageInput').style.height = 'auto';
                document.getElementById('fileInput').value = '';
                document.getElementById('sendButton').disabled = true;
                await loadMessages();
            } catch (err) {
                console.error('send error:', err);
            }
        }

        async function loadMessages(silent = false) {
            if (!currentUser) {
                location.href = 'reg_log.html';
                return;
            }
            
            try {
                const res = await fetch(`${API_URL}/api/support/history/${currentUser.id}`);
                const data = await res.json();
                if (!data.success) return;
                
                if (data.dialog_id) currentDialogId = data.dialog_id;
                
                // Проверка закрытия диалога
                if (data.is_closed && !isDialogClosed) {
                    isDialogClosed = true;
                    
                    // Блокируем ввод
                    document.getElementById('messageInput').disabled = true;
                    document.getElementById('sendButton').disabled = true;
                    document.getElementById('attachButton').disabled = true;
                    document.getElementById('fileInput').disabled = true;
                    
                    // Запускаем анимацию закрытия
                    closeDialog();
                    
                    // Показываем кнопку нового разговора через 3.5 секунды
                    setTimeout(() => {
                        showNewChatButton();
                    }, 3500);
                }
                
                const container = document.getElementById('chatMessages');
                
                if (!silent && data.messages.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="lottie-container" id="lottieEmpty"></div>
                            <div class="empty-state-text">Чат с поддержкой</div>
                            <div class="empty-state-subtext">Напишите нам — ответим быстро</div>
                        </div>
                    `;
                    if (typeof lottie !== 'undefined') {
                        lottie.loadAnimation({
                            container: document.getElementById('lottieEmpty'),
                            renderer: 'svg',
                            loop: true,
                            autoplay: true,
                            path: 'support.json'
                        });
                    }
                    return;
                }
                
                let html = '';
                let newLastId = lastMessageId;
                
                data.messages.forEach(msg => {
                    if (msg.id > newLastId) newLastId = msg.id;
                    const isUser = msg.sender === 'user';
                    let content = '';
                    
                    if (msg.metadata?.file) {
                        const f = msg.metadata.file;
                        if (f.isImage || f.type?.startsWith('image/')) {
                            content = `<img src="${f.url}" class="message-image" onclick="openFullImage('${f.url}')">`;
                        } else {
                            content = `
                                <div class="file-message">
                                    <span class="file-icon">📎</span>
                                    <div class="file-info">
                                        <div class="file-name">${f.name}</div>
                                        <div class="file-size">${(f.size/1024).toFixed(1)} KB</div>
                                    </div>
                                </div>
                            `;
                        }
                    } else {
                        content = (msg.message || '').replace(/\n/g, '<br>');
                    }
                    
                    const avatarHtml = isUser ? `
                        <div class="message-avatar">
                            ${currentUser.avatarUrl
                                ? `<img src="${currentUser.avatarUrl}" alt="">`
                                : `<span>${(currentUser.username||'U')[0].toUpperCase()}</span>`}
                        </div>
                    ` : `
                        <div class="message-avatar support">
                            <span>DS</span>
                        </div>
                    `;
                    
                    html += `
                        <div class="message-wrapper ${isUser ? 'user' : 'support'}">
                            ${avatarHtml}
                            <div class="message-content">
                                <div class="message-bubble">
                                    ${content}
                                    <div class="message-time">${formatTime(msg.created_at)}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                if (html) {
                    container.innerHTML = html;
                    container.scrollTop = container.scrollHeight;
                }
                
                lastMessageId = newLastId;
                
            } catch (err) {
                console.error('load messages error:', err);
            }
        }

        async function checkNewMessages() {
            if (!currentUser || !currentDialogId || isDialogClosed) return;
            try {
                const res = await fetch(`${API_URL}/api/support/new/${currentUser.id}/${lastMessageId}`);
                const data = await res.json();
                if (data.success && data.messages?.length > 0) {
                    await loadMessages(true);
                }
            } catch {}
        }

        // Анимация завершения диалога
        function closeDialog() {
            const overlay = document.getElementById('endOverlay');
            overlay.classList.add('active');
            
            setTimeout(() => {
                lottie.loadAnimation({
                    container: document.getElementById('endLottie'),
                    renderer: 'svg',
                    loop: false,
                    autoplay: true,
                    path: 'enddialog.json'
                });
            }, 200);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            currentUser = loadUser();
            if (!currentUser) {
                location.href = 'reg_log.html';
                return;
            }

            const msgInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendButton');
            const attachBtn = document.getElementById('attachButton');
            const fileInp = document.getElementById('fileInput');
            const backBtn = document.getElementById('backButton');

            msgInput.addEventListener('input', autoGrowTextarea);
            msgInput.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (msgInput.value.trim() && !isDialogClosed) sendMessage(msgInput.value);
                }
            });

            sendBtn.addEventListener('click', () => {
                if (msgInput.value.trim() && !isDialogClosed) sendMessage(msgInput.value);
            });

            attachBtn.addEventListener('click', () => {
                if (!isDialogClosed) fileInp.click();
            });

            fileInp.addEventListener('change', e => {
                const file = e.target.files[0];
                if (file && !isDialogClosed) sendMessage('', file);
            });

            backBtn.addEventListener('click', () => location.href = 'main.html');

            await loadMessages();
            
            if (currentDialogId && !isDialogClosed) {
                pollingInterval = setInterval(checkNewMessages, 2800);
            }
        });

        window.addEventListener('beforeunload', () => {
            if (pollingInterval) clearInterval(pollingInterval);
        });
    </script>
</body>
</html>
