<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Поддержка | Duck Shop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0a1f44;
      color: white;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-height: -webkit-fill-available;
      min-height: fill-available;
      background: transparent;
    }

    .chat-header {
      padding: 12px 16px;
      background: rgba(15, 35, 80, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 100;
    }

    .back-button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .back-button svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .support-info {
      flex: 1;
    }

    .support-name {
      font-size: 17px;
      font-weight: 600;
    }

    .support-status {
      font-size: 13px;
      color: #a0c4ff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #34c759;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(52,199,89,0.3);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: transparent;
      scroll-behavior: smooth;
    }

    .message-wrapper {
      display: flex;
      align-items: flex-start;
      max-width: 85%;
    }

    .message-wrapper.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-wrapper.support {
      align-self: flex-start;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      margin: 0 8px;
      background: #1e90ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      border: 1.5px solid rgba(255,255,255,0.25);
      align-self: flex-start;
      margin-top: 2px;
    }

    .message-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .message-bubble {
      padding: 9px 13px;
      border-radius: 18px;
      font-size: 15.5px;
      line-height: 1.38;
      word-break: break-word;
      position: relative;
      max-width: 100%;
    }

    .message-wrapper.user .message-bubble {
      background: #2481ff;
      color: white;
      border-bottom-right-radius: 4px;
      margin-right: 0;
      margin-left: auto;
    }

    .message-wrapper.support .message-bubble {
      background: rgba(255,255,255,0.13);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      border-bottom-left-radius: 4px;
    }

    .message-time {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 3px;
      text-align: right;
      padding-right: 2px;
    }

    .message-image {
      max-width: 260px;
      border-radius: 16px;
      margin: 4px 0;
      display: block;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .file-bubble {
      padding: 10px 14px;
      background: rgba(255,255,255,0.12);
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 320px;
    }

    .file-icon {
      font-size: 28px;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-size {
      font-size: 12px;
      opacity: 0.7;
    }

    .chat-input-area {
      padding: 10px 12px;
      background: rgba(15, 35, 80, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom, 0);
      box-sizing: border-box;
    }

    .attach-button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.11);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .attach-button svg {
      width: 22px;
      height: 22px;
      fill: white;
    }

    .input-wrapper {
      flex: 1;
      background: rgba(255,255,255,0.10);
      border-radius: 24px;
      padding: 8px 16px;
      border: 1px solid rgba(255,255,255,0.14);
    }

    .chat-input {
      width: 100%;
      background: transparent;
      border: none;
      color: white;
      font-size: 16px;
      outline: none;
      resize: none;
      min-height: 22px;
      max-height: 120px;
      line-height: 1.4;
      padding: 2px 0;
    }

    .chat-input::placeholder {
      color: rgba(255,255,255,0.55);
    }

    .send-button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #2196f3;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .send-button:disabled {
      background: rgba(255,255,255,0.15);
      cursor: not-allowed;
    }

    .send-button svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .image-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: zoom-out;
    }

    .image-modal img {
      max-width: 96%;
      max-height: 96%;
      object-fit: contain;
      border-radius: 12px;
    }

    @media (max-width: 500px) {
      .chat-header { padding: 10px 14px; }
      .chat-messages { padding: 12px 10px; }
      .message-image { max-width: 240px; }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <button class="back-button" id="backButton">
        <svg viewBox="0 0 24 24">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
      </button>
      <div class="support-info">
        <div class="support-name">Поддержка Duck Shop</div>
        <div class="support-status">
          <span class="status-dot"></span>
          онлайн
        </div>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages">
      <!-- сообщения будут здесь -->
    </div>

    <div class="chat-input-area">
      <button class="attach-button" id="attachButton">
        <svg viewBox="0 0 24 24">
          <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
        </svg>
      </button>
      <input type="file" id="fileInput" accept="image/*" style="display:none;">

      <div class="input-wrapper">
        <textarea 
          id="messageInput" 
          class="chat-input" 
          placeholder="Сообщение..." 
          rows="1"
        ></textarea>
      </div>

      <button class="send-button" id="sendButton" disabled>
        <svg viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const API_URL = 'https://duck-shop-sever.onrender.com';

    let currentUser = null;
    let currentDialogId = null;
    let lastMessageId = 0;
    let pollingInterval = null;

    function loadUser() {
      try {
        const data = localStorage.getItem('duck_user_v1');
        return data ? JSON.parse(data) : null;
      } catch (e) {
        console.error('Error loading user:', e);
        return null;
      }
    }

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    }

    function autoGrowTextarea() {
      const ta = document.getElementById('messageInput');
      if (!ta) return;
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
      document.getElementById('sendButton').disabled = !ta.value.trim();
    }

    function openFullImage(src) {
      const modal = document.createElement('div');
      modal.className = 'image-modal';
      modal.innerHTML = `<img src="${src}" alt="full image">`;
      modal.onclick = () => modal.remove();
      document.body.appendChild(modal);
    }

    async function sendMessage(text = '', file = null) {
      if (!currentUser) return;

      const formData = new FormData();
      formData.append('user_id', currentUser.id);
      if (currentDialogId) formData.append('dialog_id', currentDialogId);
      
      if (file) {
        formData.append('file', file);
      } else if (text.trim()) {
        formData.append('message', text.trim());
      } else {
        return;
      }

      try {
        const resp = await fetch(`${API_URL}/api/support/message`, {
          method: 'POST',
          body: formData
        });

        const data = await resp.json();
        if (data.dialog_id) currentDialogId = data.dialog_id;

        document.getElementById('messageInput').value = '';
        document.getElementById('messageInput').style.height = 'auto';
        document.getElementById('fileInput').value = '';
        document.getElementById('sendButton').disabled = true;

        await loadMessages();
      } catch (err) {
        console.error('send error:', err);
      }
    }

    async function loadMessages(silent = false) {
      if (!currentUser) return;

      try {
        const res = await fetch(`${API_URL}/api/support/history/${currentUser.id}`);
        const data = await res.json();

        if (!data.success) return;

        if (data.dialog_id) currentDialogId = data.dialog_id;

        const container = document.getElementById('chatMessages');
        if (!silent && data.messages.length === 0) {
          container.innerHTML = `
            <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; color:#aaa; text-align:center; padding:30px;">
              <div style="font-size:64px; margin-bottom:16px;">💬</div>
              <div style="font-size:20px; margin-bottom:8px;">Чат с поддержкой</div>
              <div style="font-size:15px; opacity:0.8;">Напишите первое сообщение — ответим максимально быстро</div>
            </div>
          `;
          return;
        }

        let html = '';
        let newLastId = lastMessageId;

        data.messages.forEach(msg => {
          if (msg.id > newLastId) newLastId = msg.id;

          const isUser = msg.sender === 'user';
          let content = '';

          if (msg.metadata?.file) {
            const f = msg.metadata.file;
            if (f.type?.startsWith('image/')) {
              content = `<img src="${f.url}" class="message-image" onclick="openFullImage('${f.url}')">`;
            } else {
              content = `
                <div class="file-bubble">
                  <span class="file-icon">📎</span>
                  <div class="file-info">
                    <div class="file-name">${f.name}</div>
                    <div class="file-size">${(f.size/1024).toFixed(1)} KB</div>
                  </div>
                </div>
              `;
            }
          } else {
            content = (msg.message || '').replace(/\n/g, '<br>');
          }

          const avatarHtml = isUser ? `
            <div class="message-avatar">
              ${currentUser.avatarUrl 
                ? `<img src="${currentUser.avatarUrl}" alt="">` 
                : `<span>${(currentUser.username||'U')[0].toUpperCase()}</span>`}
            </div>
          ` : '';

          html += `
            <div class="message-wrapper ${isUser ? 'user' : 'support'}">
              ${avatarHtml}
              <div class="message-content">
                <div class="message-bubble">
                  ${content}
                  <div class="message-time">${formatTime(msg.created_at)}</div>
                </div>
              </div>
            </div>
          `;
        });

        if (html) {
          container.innerHTML = html;
          container.scrollTop = container.scrollHeight;
        }

        lastMessageId = newLastId;

      } catch (err) {
        console.error('load messages error:', err);
      }
    }

    async function checkNewMessages() {
      if (!currentUser || !currentDialogId) return;
      try {
        const res = await fetch(`${API_URL}/api/support/new/${currentUser.id}/${lastMessageId}`);
        const data = await res.json();
        if (data.success && data.messages?.length > 0) {
          await loadMessages(true);
        }
      } catch {}
    }

    document.addEventListener('DOMContentLoaded', async () => {
      currentUser = loadUser();
      if (!currentUser) {
        location.href = 'reg_log.html';
        return;
      }

      const msgInput = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendButton');
      const attachBtn = document.getElementById('attachButton');
      const fileInp = document.getElementById('fileInput');
      const backBtn = document.getElementById('backButton');

      msgInput.addEventListener('input', autoGrowTextarea);
      msgInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (msgInput.value.trim()) sendMessage(msgInput.value);
        }
      });

      sendBtn.addEventListener('click', () => {
        if (msgInput.value.trim()) sendMessage(msgInput.value);
      });

      attachBtn.addEventListener('click', () => fileInp.click());

      fileInp.addEventListener('change', e => {
        const file = e.target.files[0];
        if (file) sendMessage('', file);
      });

      backBtn.addEventListener('click', () => location.href = 'main.html');

      await loadMessages();
      if (currentDialogId) {
        pollingInterval = setInterval(checkNewMessages, 2800);
      }
    });

    window.addEventListener('beforeunload', () => {
      if (pollingInterval) clearInterval(pollingInterval);
    });
  </script>
</body>
</html>
