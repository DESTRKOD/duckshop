<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Поддержка - Duck Shop</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height:100%;
      overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:linear-gradient(180deg,#0b3c91 0%,#1565c0 55%,#42a5f5 100%);
      color:#fff;
    }
    .chat-container {
      display:flex;
      flex-direction:column;
      height:100vh;
      min-height:-webkit-fill-available;
      background:transparent;
      overflow:hidden;
    }
    .chat-header {
      padding:12px 16px;
      background:rgba(11,60,145,0.98);
      backdrop-filter:blur(12px);
      display:flex;
      align-items:center;
      gap:12px;
      flex-shrink:0;
      border-bottom:1px solid rgba(255,255,255,0.15);
      z-index:10;
    }
    .back-button {
      width:36px; height:36px;
      border-radius:50%;
      background:rgba(255,255,255,0.15);
      border:none;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
    }
    .back-button:hover { background:rgba(255,255,255,0.28); }
    .back-button svg { width:20px; height:20px; fill:#fff; }
    .support-info { flex:1; }
    .support-name { font-size:17px; font-weight:700; margin-bottom:2px; }
    .support-status { font-size:13px; color:#c3dfff; display:flex; align-items:center; gap:6px; }
    .status-dot { width:8px; height:8px; border-radius:50%; background:#4caf50; box-shadow:0 0 0 2px rgba(76,175,80,0.35); }

    .chat-messages {
      flex:1;
      overflow-y:auto;
      padding:10px 8px;
      display:flex;
      flex-direction:column;
      gap:6px;
      scroll-behavior:smooth;
    }

    .message-wrapper {
      display:flex;
      width:100%;
      align-items:flex-start;
      margin-bottom:3px;
    }
    .message-wrapper.user {
      justify-content:flex-end;
      flex-direction:row-reverse !important; /* жёсткое выравнивание справа */
    }
    .message-wrapper.support {
      justify-content:flex-start;
    }

    .message-avatar {
      width:32px; height:32px;
      border-radius:50%;
      overflow:hidden;
      flex-shrink:0;
      margin:0 6px;
      border:2px solid rgba(255,255,255,0.2);
      background:#1e90ff;
      display:flex; align-items:center; justify-content:center;
      font-size:14px; font-weight:bold;
    }
    .message-avatar img { width:100%; height:100%; object-fit:cover; }
    .message-avatar.support { background:#4caf50; } /* зелёный для поддержки */

    .message-content {
      max-width:78%;
      display:flex;
      flex-direction:column;
    }

    .message-bubble {
      padding:7px 11px; /* минимум воды внутри пузыря */
      font-size:15px;
      line-height:1.32;
      border-radius:18px;
      word-break:break-word;
      white-space:pre-wrap;
    }

    .message-wrapper.user .message-bubble {
      background:linear-gradient(135deg,#1976d2 0%,#0d47a1 100%);
      color:#fff;
      border-bottom-right-radius:6px;
      box-shadow:0 1px 2px rgba(0,0,0,0.25);
      margin-left:auto;
    }

    .message-wrapper.support .message-bubble {
      background:rgba(255,255,255,0.14);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.12);
      color:#fff;
      border-bottom-left-radius:6px;
      box-shadow:0 1px 2px rgba(0,0,0,0.2);
      margin-right:auto;
    }

    .message-time {
      font-size:10.5px;
      opacity:0.7;
      margin-top:2px;
      text-align:right;
      align-self:flex-end;
    }

    .message-image {
      max-width:240px;
      border-radius:14px;
      margin:3px 0;
      display:block;
      cursor:pointer;
      box-shadow:0 2px 6px rgba(0,0,0,0.3);
    }

    .chat-input-area {
      padding:10px 14px;
      background:rgba(11,60,145,0.98);
      backdrop-filter:blur(12px);
      border-top:1px solid rgba(255,255,255,0.15);
      display:flex;
      align-items:flex-end;
      gap:8px;
      flex-shrink:0;
      padding-bottom:env(safe-area-inset-bottom,0);
    }

    .attach-button, .send-button {
      width:32px; height:32px; /* уменьшили иконки */
      border-radius:50%;
      border:none;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
      margin-bottom:4px;
    }
    .attach-button { background:rgba(255,255,255,0.14); }
    .attach-button:hover { background:rgba(255,255,255,0.24); }
    .attach-button svg, .send-button svg { width:18px; height:18px; fill:#fff; }
    .send-button { background:#2196f3; }
    .send-button:hover:not(:disabled) { background:#1976d2; transform:scale(1.05); }
    .send-button:disabled { background:rgba(255,255,255,0.18); cursor:not-allowed; }

    .input-wrapper {
      flex:1;
      background:rgba(255,255,255,0.13);
      border-radius:22px;
      padding:8px 14px;
      border:1px solid rgba(255,255,255,0.16);
      min-height:40px;
    }

    .chat-input {
      width:100%;
      background:transparent;
      border:none;
      color:#fff;
      font-size:15px;
      outline:none;
      resize:none;
      max-height:80px;
      line-height:1.35;
      padding:1px 0;
    }
    .chat-input::placeholder { color:rgba(255,255,255,0.55); }

    .empty-state {
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
    }
    .empty-state-text { font-size:18px; font-weight:600; margin-bottom:8px; }
    .empty-state-subtext { font-size:14px; opacity:0.8; }

    .image-modal {
      position:fixed; inset:0;
      background:rgba(0,0,0,0.95);
      display:flex; align-items:center; justify-content:center;
      z-index:1000;
      cursor:zoom-out;
    }
    .image-modal img {
      max-width:96%; max-height:96%;
      object-fit:contain;
      border-radius:10px;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <button class="back-button" id="backButton">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <div class="support-info">
        <div class="support-name">Поддержка Duck Shop</div>
        <div class="support-status">
          <span class="status-dot"></span> в сети
        </div>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input-area">
      <button class="attach-button" id="attachButton">
        <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
      </button>
      <input type="file" id="fileInput" accept="image/*" style="display:none;">
      <div class="input-wrapper">
        <textarea id="messageInput" class="chat-input" placeholder="Сообщение..." rows="1"></textarea>
      </div>
      <button class="send-button" id="sendButton" disabled>
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script>
    const API_URL = 'https://duck-shop-sever.onrender.com';
    let currentUser = null;
    let currentDialogId = null;
    let lastMessageId = 0;
    let pollingInterval = null;

    function loadUser() {
      try {
        const data = localStorage.getItem('duck_user_v1');
        return data ? JSON.parse(data) : null;
      } catch {
        return null;
      }
    }

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    }

    function autoGrowTextarea() {
      const ta = document.getElementById('messageInput');
      if (!ta) return;
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 80) + 'px';
      document.getElementById('sendButton').disabled = !ta.value.trim();
    }

    function openFullImage(src) {
      const modal = document.createElement('div');
      modal.className = 'image-modal';
      modal.innerHTML = `<img src="${src}" alt="full image">`;
      modal.onclick = () => modal.remove();
      document.body.appendChild(modal);
    }

    async function sendMessage(text = '', file = null) {
      if (!currentUser) return;
      const formData = new FormData();
      formData.append('user_id', currentUser.id);
      if (currentDialogId) formData.append('dialog_id', currentDialogId);
      if (file) formData.append('file', file);
      else if (text.trim()) formData.append('message', text.trim());
      else return;

      try {
        const resp = await fetch(`${API_URL}/api/support/message`, {
          method: 'POST',
          body: formData
        });
        const data = await resp.json();
        if (data.dialog_id) currentDialogId = data.dialog_id;
        document.getElementById('messageInput').value = '';
        document.getElementById('messageInput').style.height = 'auto';
        document.getElementById('fileInput').value = '';
        document.getElementById('sendButton').disabled = true;
        await loadMessages();
      } catch (err) {
        console.error('send error:', err);
      }
    }

    async function loadMessages(silent = false) {
      if (!currentUser) return;
      try {
        const res = await fetch(`${API_URL}/api/support/history/${currentUser.id}`);
        const data = await res.json();
        if (!data.success) return;
        if (data.dialog_id) currentDialogId = data.dialog_id;
        const container = document.getElementById('chatMessages');
        if (!silent && data.messages.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-text">Чат с поддержкой</div>
              <div class="empty-state-subtext">Напишите нам — ответим быстро</div>
            </div>
          `;
          return;
        }
        let html = '';
        let newLastId = lastMessageId;
        data.messages.forEach(msg => {
          if (msg.id > newLastId) newLastId = msg.id;
          const isUser = msg.sender === 'user';
          let content = '';
          if (msg.metadata?.file) {
            const f = msg.metadata.file;
            if (f.isImage || f.type?.startsWith('image/')) {
              content = `<img src="${f.url}" class="message-image" onclick="openFullImage('${f.url}')">`;
            } else {
              content = `
                <div class="file-message">
                  <span class="file-icon">📎</span>
                  <div class="file-info">
                    <div class="file-name">${f.name}</div>
                    <div class="file-size">${(f.size/1024).toFixed(1)} KB</div>
                  </div>
                </div>
              `;
            }
          } else {
            content = (msg.message || '').replace(/\n/g, '<br>');
          }
          const avatarHtml = isUser ? `
            <div class="message-avatar">
              ${currentUser.avatarUrl 
                ? `<img src="${currentUser.avatarUrl}" alt="">` 
                : `<span>${(currentUser.username||'U')[0].toUpperCase()}</span>`}
            </div>
          ` : `
            <div class="message-avatar support">
              <span>DS</span> <!-- DS = Duck Shop, можно заменить на иконку -->
            </div>
          `;
          html += `
            <div class="message-wrapper ${isUser ? 'user' : 'support'}">
              ${avatarHtml}
              <div class="message-content">
                <div class="message-bubble">
                  ${content}
                  <div class="message-time">${formatTime(msg.created_at)}</div>
                </div>
              </div>
            </div>
          `;
        });
        if (html) {
          container.innerHTML = html;
          container.scrollTop = container.scrollHeight;
        }
        lastMessageId = newLastId;
      } catch (err) {
        console.error('load messages error:', err);
      }
    }

    async function checkNewMessages() {
      if (!currentUser || !currentDialogId) return;
      try {
        const res = await fetch(`${API_URL}/api/support/new/${currentUser.id}/${lastMessageId}`);
        const data = await res.json();
        if (data.success && data.messages?.length > 0) {
          await loadMessages(true);
        }
      } catch {}
    }

    document.addEventListener('DOMContentLoaded', async () => {
      currentUser = loadUser();
      if (!currentUser) {
        location.href = 'reg_log.html';
        return;
      }
      const msgInput = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendButton');
      const attachBtn = document.getElementById('attachButton');
      const fileInp = document.getElementById('fileInput');
      const backBtn = document.getElementById('backButton');

      msgInput.addEventListener('input', autoGrowTextarea);
      msgInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (msgInput.value.trim()) sendMessage(msgInput.value);
        }
      });
      sendBtn.addEventListener('click', () => {
        if (msgInput.value.trim()) sendMessage(msgInput.value);
      });
      attachBtn.addEventListener('click', () => fileInp.click());
      fileInp.addEventListener('change', e => {
        const file = e.target.files[0];
        if (file) sendMessage('', file);
      });
      backBtn.addEventListener('click', () => location.href = 'main.html');

      await loadMessages();
      if (currentDialogId) {
        pollingInterval = setInterval(checkNewMessages, 2800);
      }
    });

    window.addEventListener('beforeunload', () => {
      if (pollingInterval) clearInterval(pollingInterval);
    });
  </script>
</body>
</html>
