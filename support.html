<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Поддержка - Duck Shop</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height:100%;
      margin:0;
      overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:linear-gradient(180deg,#0b3c91 0%,#1565c0 55%,#42a5f5 100%);
      color:#000;
    }
    .chat-container {
      display:flex;
      flex-direction:column;
      height:100%;
      min-height:-webkit-fill-available;
      background:#f0f2f5;
      overflow:hidden;
    }
    .chat-header {
      padding:12px 16px;
      background:#007aff;
      color:#fff;
      display:flex;
      align-items:center;
      gap:12px;
      flex-shrink:0;
      position:relative;
      z-index:10;
    }
    .back-button {
      width:36px; height:36px;
      border-radius:50%;
      background:rgba(255,255,255,0.2);
      border:none;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
    }
    .back-button svg { width:20px; height:20px; fill:#fff; }
    .support-name { font-size:17px; font-weight:600; flex:1; text-align:center; }

    .chat-messages {
      flex:1;
      overflow-y:auto;
      padding:12px 10px;
      display:flex;
      flex-direction:column;
      gap:8px;
      background:#f0f2f5;
      scroll-behavior:smooth;
      -webkit-overflow-scrolling:touch;
    }

    .message-wrapper {
      display:flex;
      max-width:85%;
      margin-bottom:4px;
    }
    .message-wrapper.user {
      align-self:flex-end;
      flex-direction:row-reverse;
    }
    .message-wrapper.support {
      align-self:flex-start;
    }

    .message-bubble {
      padding:8px 12px;
      font-size:15px;
      line-height:1.4;
      border-radius:18px;
      word-break:break-word;
      white-space:pre-wrap;
      position:relative;
    }

    .message-wrapper.support .message-bubble {
      background:#fff;
      color:#000;
      border-bottom-left-radius:4px;
      box-shadow:0 1px 2px rgba(0,0,0,0.1);
    }

    .message-wrapper.user .message-bubble {
      background:#007aff;
      color:#fff;
      border-bottom-right-radius:4px;
      box-shadow:0 1px 2px rgba(0,0,0,0.15);
    }

    .message-time {
      font-size:11px;
      opacity:0.6;
      margin-top:4px;
      text-align:right;
      align-self:flex-end;
      white-space:nowrap;
    }

    .chat-input-area {
      padding:10px 12px;
      background:#fff;
      border-top:1px solid #ddd;
      display:flex;
      align-items:center;
      gap:8px;
      flex-shrink:0;
      min-height:54px;
      padding-bottom:calc(env(safe-area-inset-bottom, 0) + 10px);
    }

    .attach-button, .send-button {
      width:40px; height:40px;
      border-radius:50%;
      border:none;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
    }
    .attach-button { background:#f0f0f0; }
    .attach-button svg { width:22px; height:22px; fill:#555; }
    .send-button { background:#007aff; }
    .send-button svg { width:22px; height:22px; fill:#fff; }
    .send-button:disabled { background:#ccc; cursor:not-allowed; }

    .input-wrapper {
      flex:1;
      background:#f0f0f0;
      border-radius:20px;
      padding:8px 14px;
      display:flex;
      align-items:center;
    }

    .chat-input {
      width:100%;
      background:transparent;
      border:none;
      color:#000;
      font-size:16px;
      outline:none;
      resize:none;
      line-height:1.4;
      padding:0;
    }
    .chat-input::placeholder { color:#888; }

    .empty-state {
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
      color:#555;
    }
    .lottie-container {
      width:180px;
      height:180px;
      margin-bottom:16px;
    }
    .empty-state-text { font-size:18px; font-weight:600; margin-bottom:8px; }
    .empty-state-subtext { font-size:14px; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <button class="back-button" id="backButton">
        <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="#fff"/></svg>
      </button>
      <div class="support-name">Поддержка Duck Shop</div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input-area">
      <button class="attach-button" id="attachButton">
        <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z" fill="#555"/></svg>
      </button>
      <input type="file" id="fileInput" accept="image/*" style="display:none;">
      <div class="input-wrapper">
        <textarea id="messageInput" class="chat-input" placeholder="Сообщение..." rows="1"></textarea>
      </div>
      <button class="send-button" id="sendButton" disabled>
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="#fff"/></svg>
      </button>
    </div>
  </div>

  <script>
    const API_URL = 'https://duck-shop-sever.onrender.com';
    let currentUser = null;
    let currentDialogId = null;
    let lastMessageId = 0;
    let pollingInterval = null;

    function loadUser() {
      try {
        const data = localStorage.getItem('duck_user_v1');
        return data ? JSON.parse(data) : null;
      } catch {
        return null;
      }
    }

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    }

    function autoGrowTextarea() {
      const ta = document.getElementById('messageInput');
      if (!ta) return;
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 80) + 'px';
      document.getElementById('sendButton').disabled = !ta.value.trim();
    }

    async function sendMessage(text = '', file = null) {
      if (!currentUser) return;
      const formData = new FormData();
      formData.append('user_id', currentUser.id);
      if (currentDialogId) formData.append('dialog_id', currentDialogId);
      if (file) formData.append('file', file);
      else if (text.trim()) formData.append('message', text.trim());
      else return;

      try {
        const resp = await fetch(`${API_URL}/api/support/message`, {
          method: 'POST',
          body: formData
        });
        const data = await resp.json();
        if (data.dialog_id) currentDialogId = data.dialog_id;
        document.getElementById('messageInput').value = '';
        document.getElementById('messageInput').style.height = 'auto';
        document.getElementById('fileInput').value = '';
        document.getElementById('sendButton').disabled = true;
        await loadMessages();
      } catch (err) {
        console.error('send error:', err);
      }
    }

    async function loadMessages(silent = false) {
      if (!currentUser) {
        location.href = 'reg_log.html';
        return;
      }
      try {
        const res = await fetch(`${API_URL}/api/support/history/${currentUser.id}`);
        const data = await res.json();
        if (!data.success) return;
        if (data.dialog_id) currentDialogId = data.dialog_id;
        const container = document.getElementById('chatMessages');
        if (!silent && data.messages.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="lottie-container" id="lottieEmpty"></div>
              <div class="empty-state-text">Чат с поддержкой</div>
              <div class="empty-state-subtext">Напишите нам — ответим быстро</div>
            </div>
          `;
          if (typeof lottie !== 'undefined') {
            lottie.loadAnimation({
              container: document.getElementById('lottieEmpty'),
              renderer: 'svg',
              loop: true,
              autoplay: true,
              path: 'support.json'
            });
          }
          return;
        }
        let html = '';
        let newLastId = lastMessageId;
        data.messages.forEach(msg => {
          if (msg.id > newLastId) newLastId = msg.id;
          const isUser = msg.sender === 'user';
          let content = '';
          if (msg.metadata?.file) {
            const f = msg.metadata.file;
            if (f.isImage || f.type?.startsWith('image/')) {
              content = `<img src="${f.url}" class="message-image" onclick="openFullImage('${f.url}')">`;
            } else {
              content = `
                <div class="file-message">
                  <span class="file-icon">📎</span>
                  <div class="file-info">
                    <div class="file-name">${f.name}</div>
                    <div class="file-size">${(f.size/1024).toFixed(1)} KB</div>
                  </div>
                </div>
              `;
            }
          } else {
            content = (msg.message || '').replace(/\n/g, '<br>');
          }
          html += `
            <div class="message-wrapper ${isUser ? 'user' : 'support'}">
              <div class="message-bubble">
                ${content}
                <div class="message-time">${formatTime(msg.created_at)}</div>
              </div>
            </div>
          `;
        });
        if (html) {
          container.innerHTML = html;
          container.scrollTop = container.scrollHeight;
        }
        lastMessageId = newLastId;
      } catch (err) {
        console.error('load messages error:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      currentUser = loadUser();
      if (!currentUser) {
        location.href = 'reg_log.html';
        return;
      }
      const msgInput = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendButton');
      const attachBtn = document.getElementById('attachButton');
      const fileInp = document.getElementById('fileInput');
      const backBtn = document.getElementById('backButton');

      msgInput.addEventListener('input', autoGrowTextarea);
      msgInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (msgInput.value.trim()) sendMessage(msgInput.value);
        }
      });
      sendBtn.addEventListener('click', () => {
        if (msgInput.value.trim()) sendMessage(msgInput.value);
      });
      attachBtn.addEventListener('click', () => fileInp.click());
      fileInp.addEventListener('change', e => {
        const file = e.target.files[0];
        if (file) sendMessage('', file);
      });
      backBtn.addEventListener('click', () => location.href = 'main.html');

      await loadMessages();
    });
  </script>
</body>
</html>
