<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выберите способ оплаты | Duck Shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/png" href="https://i.imgur.com/S4nWZZp.png">
    <link rel="shortcut icon" type="image/png" href="https://i.imgur.com/S4nWZZp.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/YOUhVyG.png">
    <meta name="theme-color" content="#0b3c91">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #0b3c91 0%, #1565c0 55%, #42a5f5 100%);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 32px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sticker {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            color: white;
            text-align: center;
            margin-bottom: 24px;
        }

        .payment-methods {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .method-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            margin-bottom: 12px;
        }

        .method-item:last-child {
            margin-bottom: 0;
        }

        .method-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.3);
            background: rgba(50, 50, 70, 0.5);
        }

        .method-item.selected {
            background: rgba(76, 175, 80, 0.2);
            border-color: #4caf50;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .method-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .method-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .method-icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .method-name {
            color: white;
            font-weight: 700;
            font-size: 17px;
        }

        .radio-circle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: transparent;
            transition: all 0.2s;
        }

        .method-item.selected .radio-circle {
            background: #4caf50;
            border-color: #4caf50;
            box-shadow: 0 0 8px #4caf50;
        }

        .pay-button {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(90deg, #00c853, #00a86b);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(0, 200, 83, 0.3);
        }

        .pay-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 200, 83, 0.4);
        }

        .pay-button:active {
            transform: translateY(1px);
        }

        .pay-button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            background: #555;
            box-shadow: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 16px;
            }
            .sticker {
                width: 150px;
                height: 150px;
            }
            .title {
                font-size: 24px;
            }
            .method-name {
                font-size: 15px;
            }
            .method-icon {
                width: 40px;
                height: 40px;
            }
            .method-icon img {
                width: 28px;
                height: 28px;
            }
            .pay-button {
                font-size: 18px;
                padding: 16px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="sticker" id="lottie-animation"></div>
    <div class="title">Выберите способ оплаты</div>

    <div class="payment-methods">
        <!-- 1. Автоматическая оплата (серая, недоступна) -->
        <div class="method-item disabled" data-method="auto">
            <div class="method-info">
                <div class="method-icon" id="iconAutoContainer">
                    <img id="iconAuto" src="" alt="🤖" onerror="this.style.display='none';this.parentElement.innerHTML='🤖'">
                </div>
                <div class="method-name">Автоматическая оплата</div>
            </div>
            <div class="radio-circle"></div>
        </div>
        
        <!-- 2. Сбербанк -->
        <div class="method-item" data-method="sber">
            <div class="method-info">
                <div class="method-icon" id="iconSberContainer">
                    <img id="iconSber" src="" alt="🏦" onerror="this.style.display='none';this.parentElement.innerHTML='🏦'">
                </div>
                <div class="method-name">Сбербанк</div>
            </div>
            <div class="radio-circle"></div>
        </div>
        
        <!-- 3. Альфа Банк -->
        <div class="method-item" data-method="alfa">
            <div class="method-info">
                <div class="method-icon" id="iconAlfaContainer">
                    <img id="iconAlfa" src="" alt="🔵" onerror="this.style.display='none';this.parentElement.innerHTML='🔵'">
                </div>
                <div class="method-name">Альфа Банк</div>
            </div>
            <div class="radio-circle"></div>
        </div>
        
        <!-- 4. Озон Банк -->
        <div class="method-item" data-method="ozon">
            <div class="method-info">
                <div class="method-icon" id="iconOzonContainer">
                    <img id="iconOzon" src="" alt="🟣" onerror="this.style.display='none';this.parentElement.innerHTML='🟣'">
                </div>
                <div class="method-name">Озон Банк</div>
            </div>
            <div class="radio-circle"></div>
        </div>
        
        <!-- 5. Альфа Банк СБП -->
        <div class="method-item" data-method="alfa_sbp">
            <div class="method-info">
                <div class="method-icon" id="iconAlfaSbpContainer">
                    <img id="iconAlfaSbp" src="" alt="💳" onerror="this.style.display='none';this.parentElement.innerHTML='💳'">
                </div>
                <div class="method-name">Альфа Банк СБП</div>
            </div>
            <div class="radio-circle"></div>
        </div>
        
        <!-- 6. Озон СБП -->
        <div class="method-item" data-method="ozon_sbp">
            <div class="method-info">
                <div class="method-icon" id="iconOzonSbpContainer">
                    <img id="iconOzonSbp" src="" alt="📱" onerror="this.style.display='none';this.parentElement.innerHTML='📱'">
                </div>
                <div class="method-name">Озон СБП</div>
            </div>
            <div class="radio-circle"></div>
        </div>
    </div>

    <button class="pay-button disabled" id="payButton" disabled>Оплатить</button>
</div>

<script>
    let selectedMethod = null;
    
    // КОНСТАНТЫ ДЛЯ ИКОНОК (ЗАМЕНИТЕ НА СВОИ URL)
    const ICONS = {
        auto: 'https://i.imgur.com/auto_icon.png',
        sber: 'https://i.imgur.com/sber_icon.png',
        alfa: 'https://i.imgur.com/alfa_icon.png',
        ozon: 'https://i.imgur.com/ozon_icon.png',
        alfa_sbp: 'https://i.imgur.com/alfa_sbp.png',
        ozon_sbp: 'https://i.imgur.com/ozon_sbp.png'
    };
    
    // УСТАНОВКА ИКОНОК
    document.getElementById('iconAuto').src = ICONS.auto;
    document.getElementById('iconSber').src = ICONS.sber;
    document.getElementById('iconAlfa').src = ICONS.alfa;
    document.getElementById('iconOzon').src = ICONS.ozon;
    document.getElementById('iconAlfaSbp').src = ICONS.alfa_sbp;
    document.getElementById('iconOzonSbp').src = ICONS.ozon_sbp;

    lottie.loadAnimation({
        container: document.getElementById('lottie-animation'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: 'choose.json'
    });

    const orderData = localStorage.getItem('pending_order');
    if (!orderData) {
        alert('Данные заказа не найдены. Возвращаемся в магазин.');
        window.location.href = '/';
    }

    const methods = document.querySelectorAll('.method-item:not(.disabled)');
    methods.forEach(method => {
        method.addEventListener('click', () => {
            methods.forEach(m => m.classList.remove('selected'));
            method.classList.add('selected');
            selectedMethod = method.getAttribute('data-method');
            
            const payBtn = document.getElementById('payButton');
            payBtn.disabled = false;
            payBtn.classList.remove('disabled');
        });
    });

    document.getElementById('payButton').addEventListener('click', () => {
        if (!selectedMethod) return;
        
        const pendingOrder = JSON.parse(localStorage.getItem('pending_order'));
        pendingOrder.selectedPaymentMethod = selectedMethod;
        localStorage.setItem('pending_order', JSON.stringify(pendingOrder));
        
        // Переход БЕЗ .html
        window.location.href = `/pay?method=${selectedMethod}`;
    });
</script>
</body>
</html>
