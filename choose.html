<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Выберите способ оплаты | Duck Shop</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0b3c91 0%, #1e2a6e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 24px 20px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .animation-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 10px;
        }

        .title {
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 28px;
            letter-spacing: -0.3px;
        }

        .payment-methods {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .method-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1.5px solid transparent;
        }

        .method-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.2);
            background: rgba(50, 50, 70, 0.5);
        }

        .method-item.selected {
            background: rgba(33, 150, 243, 0.2);
            border-color: #2196f3;
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.2);
        }

        .method-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .method-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .method-name {
            color: white;
            font-weight: 600;
            font-size: 17px;
        }

        .radio-circle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: transparent;
            transition: all 0.2s;
        }

        .method-item.selected .radio-circle {
            background: #2196f3;
            border-color: #2196f3;
            box-shadow: 0 0 8px #2196f3;
        }

        .pay-button {
            background: linear-gradient(90deg, #00c853, #00a86b);
            color: white;
            font-size: 20px;
            font-weight: 800;
            padding: 18px;
            border: none;
            border-radius: 40px;
            width: 100%;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(0, 200, 83, 0.3);
            letter-spacing: 0.5px;
        }

        .pay-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 200, 83, 0.4);
        }

        .pay-button:active {
            transform: translateY(1px);
        }

        .pay-button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            background: #555;
            box-shadow: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 16px;
            }
            .method-name {
                font-size: 15px;
            }
            .pay-button {
                font-size: 18px;
                padding: 16px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="animation-container" id="lottie-animation"></div>
    <div class="title">Выберите способ оплаты</div>

    <div class="payment-methods" id="methodsList">
        <!-- 1. Автоматическая оплата (серая, недоступна) -->
        <div class="method-item disabled" data-method="auto" data-value="auto">
            <div class="method-info">
                <div class="method-icon">🤖</div>
                <div class="method-name">Автоматическая оплата</div>
            </div>
            <div class="radio-circle"></div>
        </div>
        <!-- 2. Сбербанк -->
        <div class="method-item" data-method="sber" data-value="sber">
            <div class="method-info">
                <div class="method-icon">🏦</div>
                <div class="method-name">Сбербанк</div>
            </div>
            <div class="radio-circle"></div>
        </div>
        <!-- 3. Альфа Банк -->
        <div class="method-item" data-method="alfa" data-value="alfa">
            <div class="method-info">
                <div class="method-icon">🔵</div>
                <div class="method-name">Альфа Банк</div>
            </div>
            <div class="radio-circle"></div>
        </div>
        <!-- 4. Озон Банк -->
        <div class="method-item" data-method="ozon" data-value="ozon">
            <div class="method-info">
                <div class="method-icon">🟣</div>
                <div class="method-name">Озон Банк</div>
            </div>
            <div class="radio-circle"></div>
        </div>
        <!-- 5. Альфа Банк СБП -->
        <div class="method-item" data-method="alfa_sbp" data-value="alfa_sbp">
            <div class="method-info">
                <div class="method-icon">💳</div>
                <div class="method-name">Альфа Банк СБП</div>
            </div>
            <div class="radio-circle"></div>
        </div>
        <!-- 6. Озон СБП -->
        <div class="method-item" data-method="ozon_sbp" data-value="ozon_sbp">
            <div class="method-info">
                <div class="method-icon">📱</div>
                <div class="method-name">Озон СБП</div>
            </div>
            <div class="radio-circle"></div>
        </div>
    </div>

    <button class="pay-button disabled" id="payButton" disabled>Оплатить</button>
</div>

<script>
    let selectedMethod = null;

    // Загрузка анимации
    lottie.loadAnimation({
        container: document.getElementById('lottie-animation'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: 'choose.json'
    });

    // Получаем данные заказа из localStorage
    const orderData = localStorage.getItem('pending_order');
    if (!orderData) {
        // Если нет заказа, можно перенаправить или показать ошибку
        alert('Данные заказа не найдены. Возвращаемся в магазин.');
        window.location.href = '/';
    }

    // Обработка выбора метода
    const methods = document.querySelectorAll('.method-item:not(.disabled)');
    methods.forEach(method => {
        method.addEventListener('click', () => {
            // Убираем выделение у всех
            methods.forEach(m => m.classList.remove('selected'));
            // Добавляем выделение выбранному
            method.classList.add('selected');
            selectedMethod = method.getAttribute('data-method');
            
            // Активируем кнопку оплаты
            const payBtn = document.getElementById('payButton');
            payBtn.disabled = false;
            payBtn.classList.remove('disabled');
        });
    });

    // Обработка нажатия "Оплатить"
    document.getElementById('payButton').addEventListener('click', () => {
        if (!selectedMethod) return;
        
        // Сохраняем выбранный метод в localStorage, чтобы передать на следующую страницу
        const pendingOrder = JSON.parse(localStorage.getItem('pending_order'));
        pendingOrder.selectedPaymentMethod = selectedMethod;
        localStorage.setItem('pending_order', JSON.stringify(pendingOrder));
        
        // Переходим на страницу оплаты с параметром метода
        window.location.href = `pay.html?method=${selectedMethod}`;
    });
</script>
</body>
</html>
