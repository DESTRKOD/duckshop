<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выберите способ оплаты | Duck Shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/png" href="https://i.imgur.com/S4nWZZp.png">
    <link rel="shortcut icon" type="image/png" href="https://i.imgur.com/S4nWZZp.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/YOUhVyG.png">
    <meta name="theme-color" content="#0b3c91">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #0b3c91 0%, #1565c0 55%, #42a5f5 100%);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 32px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sticker {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            color: white;
            text-align: center;
            margin-bottom: 24px;
        }

        .payment-methods {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .method-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            margin-bottom: 12px;
        }

        .method-item:last-child {
            margin-bottom: 0;
        }

        .method-item.selected {
            background: rgba(76, 175, 80, 0.2);
            border-color: #4caf50;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .method-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .method-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 28px;
        }

        .method-icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .method-name {
            color: white;
            font-weight: 700;
            font-size: 17px;
        }

        .radio-circle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: transparent;
            transition: all 0.2s;
        }

        .method-item.selected .radio-circle {
            background: #4caf50;
            border-color: #4caf50;
            box-shadow: 0 0 8px #4caf50;
        }

        .pay-button {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(90deg, #00c853, #00a86b);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(0, 200, 83, 0.3);
        }

        .pay-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 200, 83, 0.4);
        }

        .pay-button:active {
            transform: translateY(1px);
        }

        .pay-button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            background: #555;
            box-shadow: none;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            flex-direction: column;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            color: white;
            font-size: 18px;
            font-weight: 600;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 16px;
            }
            .sticker {
                width: 150px;
                height: 150px;
            }
            .title {
                font-size: 24px;
            }
            .method-name {
                font-size: 15px;
            }
            .method-icon {
                width: 40px;
                height: 40px;
                font-size: 22px;
            }
            .pay-button {
                font-size: 18px;
                padding: 16px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="sticker" id="lottie-animation"></div>
    <div class="title">Выберите способ оплаты</div>

    <div class="payment-methods">
        <div class="method-item" data-method="self_payanyway">
            <div class="method-info">
                <div class="method-icon">
                    💳
                </div>
                <div class="method-name">Self.PayAnyWay (для самозанятых)</div>
            </div>
            <div class="radio-circle"></div>
        </div>
    </div>

    <button class="pay-button disabled" id="payButton" disabled>Оплатить</button>
</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">Создание платежа...</div>
</div>

<script>
    let selectedMethod = null;

    lottie.loadAnimation({
        container: document.getElementById('lottie-animation'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: 'choose.json'
    });

    const orderData = localStorage.getItem('pending_order');
    if (!orderData) {
        alert('Данные заказа не найдены. Возвращаемся в магазин.');
        window.location.href = '/';
    }

    const methods = document.querySelectorAll('.method-item');
    methods.forEach(method => {
        method.addEventListener('click', () => {
            methods.forEach(m => m.classList.remove('selected'));
            method.classList.add('selected');
            selectedMethod = method.getAttribute('data-method');
            
            const payBtn = document.getElementById('payButton');
            payBtn.disabled = false;
            payBtn.classList.remove('disabled');
        });
    });

    document.getElementById('payButton').addEventListener('click', async () => {
        if (!selectedMethod) return;
        
        if (selectedMethod === 'self_payanyway') {
            const pendingOrder = JSON.parse(localStorage.getItem('pending_order'));
            const orderId = pendingOrder.orderId;
            const total = pendingOrder.total;
            
            const payBtn = document.getElementById('payButton');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');
            
            payBtn.disabled = true;
            payBtn.classList.add('disabled');
            loadingOverlay.classList.add('active');
            loadingText.textContent = 'Создание платежа...';
            
            try {
                const response = await fetch('/api/self-pay/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        orderId: orderId,
                        amount: total,
                        description: `Оплата заказа #${orderId} в Duck Shop`,
                        successUrl: `${window.location.origin}/success?order=${orderId}`,
                        failUrl: `${window.location.origin}/badPay?order=${orderId}`
                    })
                });
                
                const data = await response.json();
                
                if (data.success && data.paymentUrl) {
                    loadingText.textContent = 'Перенаправление на оплату...';
                    setTimeout(() => {
                        window.location.href = data.paymentUrl;
                    }, 500);
                } else {
                    loadingOverlay.classList.remove('active');
                    alert('Ошибка создания платежа: ' + (data.error || 'Неизвестная ошибка'));
                    payBtn.disabled = false;
                    payBtn.classList.remove('disabled');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                loadingOverlay.classList.remove('active');
                alert('Ошибка соединения с сервером');
                payBtn.disabled = false;
                payBtn.classList.remove('disabled');
            }
        } else {
            const pendingOrder = JSON.parse(localStorage.getItem('pending_order'));
            pendingOrder.selectedPaymentMethod = selectedMethod;
            localStorage.setItem('pending_order', JSON.stringify(pendingOrder));
            window.location.href = `/pay?method=${selectedMethod}`;
        }
    });
</script>
</body>
</html>
