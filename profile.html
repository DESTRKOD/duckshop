<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Профиль - Duck Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(180deg, #0b3c91 0%, #1565c0 55%, #42a5f5 100%);
  overflow-x: hidden;
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  opacity: 0;
  transform: translateY(16px);
  pointer-events: none;
  transition: opacity .35s ease, transform .35s ease;
  padding: 20px;
  box-sizing: border-box;
  overflow-y: auto;
}

.screen.active {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.screen.leaving {
  opacity: 0;
  transform: translateY(-40px);
}

#loading .sticker {
  width: 200px;
  height: 200px;
  margin: auto;
}

#loading .title {
  color: white;
  font-size: 24px;
  font-weight: 800;
  text-align: center;
  margin-top: 20px;
}

}

}

.edit-button:hover {
  background: rgba(255, 255, 255, 0.25);
  transform: translateY(-1px);
}

.mobile-nav {
  position: fixed;
  bottom: 16px;
  left: 16px;
  right: 16px;
  display: none;
  align-items: center;
  justify-content: space-around;
  background: rgba(65, 105, 225, 0.25);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-radius: 40px;
  padding: 8px 12px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.15);
  z-index: 10000;
  box-sizing: border-box;
  transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.4, 1);
  touch-action: pan-y;
  cursor: grab;
}

.mobile-nav:active {
  cursor: grabbing;
  transform: scale(0.98);
  transition: transform 0.05s ease;
}

<script>
const API_URL = 'https://duck-shop-sever.onrender.com';
const USER_KEY = 'duck_user_v1';
const CART_KEY = 'duck_cart_v1';
const SHOP_URL = 'index.html';

let currentUser = null;
let confirmCallback = null;

function fmtRub(n) {
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + ' ₽';
}

(function() {
  var urlParams = new URLSearchParams(window.location.search);
  var adminBypass = urlParams.get('admin_bypass');

  if (adminBypass) {
    sessionStorage.setItem('admin_bypass_active', 'true');
    sessionStorage.setItem('admin_bypass_key', adminBypass);
    window.history.replaceState({}, '', window.location.pathname);

    setTimeout(function() {
      var adminNote = document.createElement('div');
      adminNote.style.cssText = `
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.8);
        color: #ffd700;
        padding: 8px 20px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: 600;
        z-index: 10000;
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255,215,0,0.3);
        animation: fadeIn 0.3s ease;
      `;
      adminNote.textContent = '🔑 Режим администратора (техперерыв игнорируется)';
      document.body.appendChild(adminNote);

      setTimeout(function() {
        adminNote.style.opacity = '0';
        adminNote.style.transition = 'opacity 0.5s';
        setTimeout(function() {
          if (adminNote.parentNode) {
            adminNote.parentNode.removeChild(adminNote);
          }
        }, 500);
      }, 4000);
    }, 1000);

    return;
  }

  if (sessionStorage.getItem('admin_bypass_active') === 'true') {
    return;
  }

  var xhr = new XMLHttpRequest();
  xhr.open('GET', API_URL + '/api/maintenance-status', false);
  xhr.send();

  if (xhr.status === 200) {
    var data = JSON.parse(xhr.responseText);
    if (data.maintenance) {
      sessionStorage.setItem('attempted_page', window.location.pathname);
      window.location.href = 'working';
    }
  }
})();

(function() {
  var style = document.createElement('style');
  style.textContent = '@keyframes fadeIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}';
  document.head.appendChild(style);
})();

function showConfirm(title, message, callback) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMessage').textContent = message;
  confirmCallback = callback;
  document.getElementById('confirmModal').style.display = 'flex';
}

function hideConfirm() {
  document.getElementById('confirmModal').style.display = 'none';
  confirmCallback = null;
}

document.getElementById('confirmCancel').addEventListener('click', hideConfirm);
document.getElementById('confirmOk').addEventListener('click', function() {
  if (confirmCallback) {
    confirmCallback();
  }
  hideConfirm();
});

function loadCart() {
  try { return JSON.parse(localStorage.getItem(CART_KEY) || '{}'); } catch { return {}; }
}

function cartCount() {
  return Object.values(loadCart()).reduce((a, b) => a + b, 0);
}

function updateBadge() {
  const n = cartCount();
  const badge = document.getElementById('cartBadgeMobile');
  if (badge) {
    if (n > 0) {
      badge.classList.add('show');
      badge.textContent = n;
    } else {
      badge.classList.remove('show');
    }
  }
}

function loadLottieAnimations() {
  try {
    lottie.loadAnimation({
      container: document.getElementById('loadingAnim'),
      renderer: 'svg',
      loop: true,
      autoplay: true,
      path: 'loading.json'
    });
  } catch (error) {
    const sticker = document.getElementById('loadingAnim');
    if (sticker) {
      sticker.innerHTML = '<div style="color: white; font-size: 50px;">⌛</div>';
    }
  }
}

function loadNoOrdersAnimation() {
  const container = document.getElementById('noOrdersAnim');
  if (!container) return;
  container.innerHTML = '';
  try {
    lottie.loadAnimation({
      container: container,
      renderer: 'svg',
      loop: true,
      autoplay: true,
      path: 'bad_pay.json'
    });
  } catch (error) {
    container.innerHTML = '<div style="color: white; font-size: 40px;">📭</div>';
  }
}

function showScreen(id) {
  ['loading', 'profile', 'error'].forEach(s => {
    const el = document.getElementById(s);
    if (el) {
      el.classList.remove('active', 'leaving');
    }
  });
  const next = document.getElementById(id);
  if (next) {
    next.classList.add('active');
  }
}

function loadUser() {
  try { return JSON.parse(localStorage.getItem(USER_KEY)); } catch { return null; }
}

function saveUser(user) {
  try { localStorage.setItem(USER_KEY, JSON.stringify(user)); } catch (error) {}
}

function clearUser() {
  localStorage.removeItem(USER_KEY);
  currentUser = null;
}

function setupMobileNavigation() {
  const navWallet = document.getElementById('navWallet');
  const navProfile = document.getElementById('navProfile');
  const navHome = document.getElementById('navHome');
  const navSupport = document.getElementById('navSupport');
  const navCart = document.getElementById('navCart');
  const mobileNav = document.getElementById('mobileNav');

  if (navWallet) {
    navWallet.addEventListener('click', function(e) {
      e.preventDefault();
      window.location.href = 'wallet.html';
    });
  }

  if (navProfile) {
    navProfile.addEventListener('click', function(e) {
      e.preventDefault();
      window.location.href = 'profile.html';
    });
  }

  if (navHome) {
    navHome.addEventListener('click', function(e) {
      e.preventDefault();
      window.location.href = SHOP_URL;
    });
  }

  if (navSupport) {
    navSupport.addEventListener('click', function(e) {
      e.preventDefault();
      window.location.href = 'support.html';
    });
  }

  if (navCart) {
    navCart.addEventListener('click', function(e) {
      e.preventDefault();
      localStorage.setItem('open_cart', 'true');
      window.location.href = SHOP_URL;
    });
  }

  updateMobileNavActiveState();

  if (mobileNav) {
    let isDragging = false;
    let startX, startY;

    mobileNav.addEventListener('mousedown', function(e) {
      isDragging = false;
      startX = e.clientX;
      startY = e.clientY;
    });

    mobileNav.addEventListener('mousemove', function(e) {
      if (!startX) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
        isDragging = true;
      }
    });

    mobileNav.addEventListener('mouseup', function(e) {
      startX = null;
      startY = null;
    });

    mobileNav.addEventListener('touchstart', function(e) {
      isDragging = false;
      if (e.touches.length) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }
    });

    mobileNav.addEventListener('touchmove', function(e) {
      if (!startX) return;
      if (e.touches.length) {
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
          isDragging = true;
        }
      }
    });

    mobileNav.addEventListener('touchend', function(e) {
      startX = null;
      startY = null;
    });

    const navItems = [navWallet, navProfile, navHome, navSupport, navCart];
    navItems.forEach(item => {
      if (item) {
        item.addEventListener('click', function(e) {
          if (isDragging) {
            e.preventDefault();
            e.stopPropagation();
            isDragging = false;
          }
        });
      }
    });
  }
}

function updateMobileNavActiveState() {
  const navItems = {
    wallet: document.getElementById('navWallet'),
    profile: document.getElementById('navProfile'),
    home: document.getElementById('navHome'),
    support: document.getElementById('navSupport'),
    cart: document.getElementById('navCart')
  };

  Object.values(navItems).forEach(item => {
    if (item) item.classList.remove('active');
  });

  const currentPath = window.location.pathname;
  if (currentPath.includes('wallet.html')) {
    if (navItems.wallet) navItems.wallet.classList.add('active');
  } else if (currentPath.includes('profile.html')) {
    if (navItems.profile) navItems.profile.classList.add('active');
  } else if (currentPath.includes('support.html')) {
    if (navItems.support) navItems.support.classList.add('active');
  } else if (currentPath.includes('index.html') || currentPath === '/' || currentPath === '') {
    if (navItems.home) navItems.home.classList.add('active');
  }
}

async function loadProfileData() {
  if (!currentUser) {
    window.location.href = 'reg_log.html';
    return;
  }

  showScreen('loading');

  try {
    const response = await fetch(`${API_URL}/api/auth/profile/${currentUser.id}`);
    
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    
    const data = await response.json();

    if (data.success && data.user) {
      currentUser = { ...currentUser, ...data.user };
      saveUser(currentUser);
      updateProfileUI(currentUser);
      await loadOrders(data.orders || []);
      showScreen('profile');
    } else {
      throw new Error(data.error || 'Ошибка загрузки профиля');
    }
  } catch (error) {
    console.error('Ошибка загрузки профиля:', error);
    showError('Ошибка загрузки', 'Не удалось загрузить данные профиля');
  }
}

function updateProfileUI(user) {
  const avatar = document.getElementById('profileAvatar');
  const editAvatarPreview = document.getElementById('editAvatarPreview');
  const profileName = document.getElementById('profileName');
  const profileId = document.getElementById('profileId');
  const profileUsername = document.getElementById('profileUsername');
  const telegramLinkBtn = document.getElementById('telegramLinkBtn');
  const telegramLinkText = document.getElementById('telegramLinkText');
  const vkBadge = document.getElementById('vkBadge');
  const telegramStatus = document.getElementById('telegramStatus');
  const telegramName = document.getElementById('telegramName');
  const telegramUser = document.getElementById('telegramUser');
  const unlinkTelegramBtn = document.getElementById('unlinkTelegramBtn');
  const linkTelegramBtn = document.getElementById('linkTelegramBtn');

  if (!user) return;

  const firstLetter = user.username ? user.username.charAt(0).toUpperCase() : 'U';
  
  if (avatar) {
    const avatarHtml = user.avatarUrl ? 
      `<img src="${user.avatarUrl}" alt="${user.username}">` :
      `<div class="avatar-placeholder">${firstLetter}</div>`;
    avatar.innerHTML = avatarHtml;
  }
  
  if (editAvatarPreview) {
    editAvatarPreview.innerHTML = user.avatarUrl ? 
      `<img src="${user.avatarUrl}" alt="${user.username}">` :
      `<div class="avatar-placeholder">${firstLetter}</div>`;
  }

  if (profileName) {
    profileName.textContent = user.username || 'Пользователь';
  }

  const provider = user.auth_provider || 'email';

  if (vkBadge) {
    if (provider === 'vk' || provider === 'vk+telegram') {
      vkBadge.style.display = 'inline-flex';
    } else {
      vkBadge.style.display = 'none';
    }
  }

  if (provider === 'telegram' || provider === 'vk+telegram') {
    if (profileId) profileId.textContent = `TG ID: ${user.tgId || '...'}`;
    if (profileUsername) {
      profileUsername.textContent = user.telegramUsername ? `@${user.telegramUsername}` : '';
      profileUsername.style.display = user.telegramUsername ? 'block' : 'none';
    }
    if (telegramLinkBtn) telegramLinkBtn.classList.add('linked');
    if (telegramLinkText) telegramLinkText.textContent = 'Telegram привязан';

    if (telegramStatus) telegramStatus.classList.add('linked');
    if (telegramName) telegramName.textContent = user.firstName || user.username || 'Пользователь';
    if (telegramUser) telegramUser.textContent = user.telegramUsername ? `@${user.telegramUsername}` : '—';
    if (unlinkTelegramBtn) unlinkTelegramBtn.style.display = 'inline-flex';
    if (linkTelegramBtn) linkTelegramBtn.style.display = 'none';
  } else {
    if (profileId) profileId.textContent = 'Аккаунт VK ID';
    if (profileUsername) profileUsername.style.display = 'none';
    if (telegramLinkBtn) telegramLinkBtn.classList.remove('linked');
    if (telegramLinkText) telegramLinkText.textContent = 'Привязать Telegram';

    if (telegramStatus) telegramStatus.classList.remove('linked');
    if (telegramName) telegramName.textContent = 'Не привязан';
    if (telegramUser) telegramUser.textContent = '—';
    if (unlinkTelegramBtn) unlinkTelegramBtn.style.display = 'none';
    if (linkTelegramBtn) linkTelegramBtn.style.display = 'block';
  }
}

function formatDate(dateString) {
  const date = new Date(dateString);
  return date.toLocaleDateString('ru-RU', {
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
}

function getDisplayStatus(status, paymentStatus, refundAmount) {
  if (status === 'completed') return { text: 'Завершен', className: 'completed' };
  if (status === 'canceled') return { text: 'Отменен', className: 'canceled' };
  if (status === 'manyback' || refundAmount > 0) return { text: 'Возврат', className: 'manyback' };
  if (paymentStatus === 'pending' && status === 'new') return { text: 'Ожидает оплаты', className: 'pending' };
  return { text: 'В работе', className: 'waiting' };
}

async function loadOrders(orders) {
  const list = document.getElementById('ordersList');
  const count = document.getElementById('ordersCount');

  if (!list || !count) return;

  if (orders.length === 0) {
    count.textContent = '0';
    list.innerHTML = `
      <div class="no-orders">
        <div class="sticker-small" id="noOrdersAnim"></div>
        <div class="no-orders-text">У вас пока нет заказов</div>
        <div class="no-orders-subtext">Совершите первую покупку чтобы начать историю!</div>
      </div>
    `;

    setTimeout(() => {
      loadNoOrdersAnimation();
    }, 100);

    return;
  }

  count.textContent = orders.length;

  orders.sort((a, b) => new Date(b.date) - new Date(a.date));

  list.innerHTML = orders.map(order => {
    const status = getDisplayStatus(order.status, order.paymentStatus, order.refundAmount);
    const isGrayed = order.status === 'canceled' || order.status === 'manyback';

    return `
      <div class="order-item ${isGrayed ? 'grayed' : ''}" onclick="window.location.href='moreorder.html?order=${order.id}'">
        <div class="order-header">
          <div class="order-id">#${order.id}</div>
          <div class="order-date">${formatDate(order.date)}</div>
        </div>
        <div class="order-details">
          <div class="order-total">${fmtRub(order.total)}</div>
          <div class="order-status ${status.className}">${status.text}</div>
        </div>
        ${order.refundAmount ? `<div style="font-size: 12px; color: #9c27b0; margin-top: 8px;">Возврат: ${fmtRub(order.refundAmount)}</div>` : ''}
      </div>
    `;
  }).join('');
}

function showError(title, message) {
  const errorTitle = document.getElementById('errorTitle');
  const errorText = document.getElementById('errorText');
  if (errorTitle) errorTitle.textContent = title;
  if (errorText) errorText.textContent = message;
  showScreen('error');
}

function openEditModal() {
  const editUsername = document.getElementById('editUsername');
  if (editUsername && currentUser) {
    editUsername.value = currentUser.username || '';
  }
  const modal = document.getElementById('editModal');
  if (modal) modal.style.display = 'flex';
}

function closeEditModal() {
  const modal = document.getElementById('editModal');
  if (modal) modal.style.display = 'none';
}

const avatarUpload = document.getElementById('avatarUpload');
if (avatarUpload) {
  avatarUpload.addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file || !currentUser) return;

    const formData = new FormData();
    formData.append('avatar', file);
    formData.append('userId', currentUser.id);

    try {
      const response = await fetch(`${API_URL}/api/user/avatar`, {
        method: 'POST',
        body: formData
      });

      const data = await response.json();

      if (data.success) {
        currentUser.avatarUrl = data.avatarUrl;
        saveUser(currentUser);
        updateProfileUI(currentUser);
        closeEditModal();
      } else {
        alert('Ошибка при загрузке аватарки');
      }
    } catch (error) {
      alert('Ошибка сети');
    }
  });
}

const removeAvatarBtn = document.getElementById('removeAvatarBtn');
if (removeAvatarBtn) {
  removeAvatarBtn.addEventListener('click', async function() {
    if (!currentUser) return;
    
    showConfirm('Удаление фото', 'Вы уверены, что хотите удалить фото профиля?', async function() {
      const formData = new FormData();
      formData.append('avatar', new Blob([]), 'empty');
      formData.append('userId', currentUser.id);

      try {
        const response = await fetch(`${API_URL}/api/user/avatar`, {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          currentUser.avatarUrl = null;
          saveUser(currentUser);
          updateProfileUI(currentUser);
          closeEditModal();
        }
      } catch (error) {
        alert('Ошибка сети');
      }
    });
  });
}

const saveUsernameBtn = document.getElementById('saveUsernameBtn');
if (saveUsernameBtn) {
  saveUsernameBtn.addEventListener('click', async function() {
    const editUsername = document.getElementById('editUsername');
    if (!editUsername || !currentUser) return;
    
    const newUsername = editUsername.value.trim();

    if (newUsername.length < 2 || newUsername.length > 50) {
      alert('Имя должно быть от 2 до 50 символов');
      return;
    }

    try {
      const response = await fetch(`${API_URL}/api/user/username`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.id, username: newUsername })
      });

      const data = await response.json();

      if (data.success) {
        currentUser.username = data.username;
        saveUser(currentUser);
        updateProfileUI(currentUser);
        closeEditModal();
      } else {
        alert(data.error || 'Ошибка при изменении имени');
      }
    } catch (error) {
      alert('Ошибка сети');
    }
  });
}

async function generateTelegramLink() {
  if (!currentUser) return;
  
  try {
    const response = await fetch(`${API_URL}/api/user/telegram-link/${currentUser.id}`);
    const data = await response.json();

    if (data.success) {
      if (confirm('Перейти в Telegram для привязки аккаунта?')) {
        window.open(data.telegramLink, '_blank');
      }
    } else {
      alert('Ошибка генерации ссылки');
    }
  } catch (error) {
    alert('Ошибка сети');
  }
}

function openTelegramLink() {
  if (!currentUser) return;
  if (currentUser.auth_provider === 'telegram' || currentUser.auth_provider === 'vk+telegram') return;
  generateTelegramLink();
}

const unlinkTelegramBtn = document.getElementById('unlinkTelegramBtn');
if (unlinkTelegramBtn) {
  unlinkTelegramBtn.addEventListener('click', async function() {
    if (!currentUser) return;
    
    showConfirm('Отвязка Telegram', 'Вы уверены, что хотите отвязать Telegram аккаунт?', async function() {
      const btn = unlinkTelegramBtn;
      const originalText = btn.innerHTML;
      btn.innerHTML = 'Отвязываем...';
      btn.disabled = true;

      try {
        const response = await fetch(`${API_URL}/api/user/unlink-telegram`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: currentUser.id })
        });

        const data = await response.json();

        if (data.success) {
          currentUser.auth_provider = 'vk';
          currentUser.tgId = null;
          currentUser.telegramUsername = null;
          currentUser.firstName = null;
          currentUser.lastName = null;

          if (currentUser.avatarUrl && currentUser.avatarUrl.includes('api.telegram.org')) {
            currentUser.avatarUrl = null;
          }

          saveUser(currentUser);
          updateProfileUI(currentUser);
          closeEditModal();
        } else {
          alert(data.error || 'Ошибка при отвязке Telegram');
        }
      } catch (error) {
        console.error('Ошибка:', error);
        alert('Ошибка сети при отвязке Telegram');
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });
  });
}

const logoutBtn = document.getElementById('logoutBtn');
if (logoutBtn) {
  logoutBtn.addEventListener('click', () => {
    showConfirm('Выход', 'Вы уверены, что хотите выйти из аккаунта?', function() {
      clearUser();
      window.location.href = SHOP_URL;
    });
  });
}

const retryBtn = document.getElementById('retryBtn');
if (retryBtn) {
  retryBtn.addEventListener('click', () => {
    if (currentUser) loadProfileData();
    else window.location.href = 'reg_log.html';
  });
}

function checkInitialAuth() {
  const urlParams = new URLSearchParams(window.location.search);
  const authToken = urlParams.get('auth');

  if (authToken) {
    window.history.replaceState({}, '', window.location.pathname);
    verifyAuthToken(authToken);
  } else {
    currentUser = loadUser();
    if (currentUser) loadProfileData();
    else window.location.href = 'reg_log.html';
  }
}

async function verifyAuthToken(token) {
  showScreen('loading');
  try {
    const response = await fetch(`${API_URL}/api/auth/check/${token}`);
    const data = await response.json();

    if (data.success && data.authenticated && data.user) {
      currentUser = data.user;
      saveUser(data.user);
      loadProfileData();
    } else {
      showError('Ошибка авторизации', 'Не удалось войти в аккаунт');
    }
  } catch (error) {
    showError('Ошибка сети', 'Не удалось подключиться к серверу');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadLottieAnimations();
  updateBadge();
  setTimeout(checkInitialAuth, 500);
  setupMobileNavigation();
  updateMobileNavActiveState();

  window.addEventListener('click', (e) => {
    const modal = document.getElementById('editModal');
    if (e.target === modal) closeEditModal();
  });
});
</script>
</body>
