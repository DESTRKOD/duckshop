<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Профиль - Duck Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #0b3c91 0%, #1565c0 55%, #42a5f5 100%);
    }

    .profile-screen {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      color: white;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      overflow: hidden;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .profile-id {
      color: rgba(255,255,255,0.7);
      font-size: 14px;
    }

    .logout-btn {
      padding: 10px 20px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,0.2);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .stat-label {
      color: rgba(255,255,255,0.7);
      font-size: 14px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .orders-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .order-card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 20px;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .order-id {
      font-weight: 700;
    }

    .order-status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(255,255,255,0.2);
    }

    .status-completed {
      background: rgba(0,255,0,0.2);
      color: #a5d6a5;
    }

    .status-waiting {
      background: rgba(255,255,0,0.2);
      color: #ffe082;
    }

    .status-manyback {
      background: rgba(255,0,0,0.2);
      color: #ef9a9a;
    }

    .order-details {
      display: flex;
      justify-content: space-between;
      color: rgba(255,255,255,0.8);
      font-size: 14px;
    }

    .order-price {
      font-weight: 700;
      color: #ffd700;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: white;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      transition: background 0.2s;
    }

    .back-link:hover {
      background: rgba(255,255,255,0.2);
    }

    .loading {
      text-align: center;
      padding: 50px;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      background: rgba(255,0,0,0.2);
      border: 1px solid rgba(255,0,0,0.3);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="profile-screen">
    <a href="index.html" class="back-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      На главную
    </a>

    <div id="profileContent">
      <!-- Профиль будет загружен сюда -->
    </div>
  </div>

  <script>
    const API_URL = 'https://duck-shop-sever.onrender.com';
    const USER_KEY = 'duck_user_v1';
    const SITE_URL = 'https://shopdxs.ru';

    // Загрузка пользователя
    function loadUser() {
      try {
        const userData = localStorage.getItem(USER_KEY);
        return userData ? JSON.parse(userData) : null;
      } catch {
        return null;
      }
    }

    // Сохранение пользователя
    function saveUser(user) {
      try {
        localStorage.setItem(USER_KEY, JSON.stringify(user));
      } catch {}
    }

    // Выход
    function logout() {
      localStorage.removeItem(USER_KEY);
      window.location.href = 'index.html';
    }

    // Форматирование цены
    function formatPrice(price) {
      return price.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';
    }

    // Статус заказа
    function getStatusText(status) {
      const statuses = {
        'new': '🆕 Новый',
        'pending': '⏳ Ожидает оплаты',
        'confirmed': '✅ Оплачен',
        'waiting': '⏳ В обработке',
        'waiting_code_request': '⏳ Ожидает код',
        'completed': '🎉 Выполнен',
        'canceled': '❌ Отменен',
        'manyback': '💰 Возврат'
      };
      return statuses[status] || status;
    }

    // Класс статуса
    function getStatusClass(status) {
      if (status === 'completed') return 'status-completed';
      if (['waiting', 'waiting_code_request'].includes(status)) return 'status-waiting';
      if (status === 'manyback') return 'status-manyback';
      return '';
    }

    // Рендеринг профиля
    function renderProfile(user, orders = []) {
      const content = document.getElementById('profileContent');
      
      const avatarHtml = user.avatarUrl 
        ? `<img src="${user.avatarUrl}" alt="avatar">`
        : `<span>${user.username ? user.username[0].toUpperCase() : '?'}</span>`;

      const stats = {
        total: orders.length,
        completed: orders.filter(o => o.status === 'completed').length,
        waiting: orders.filter(o => ['waiting', 'waiting_code_request'].includes(o.status)).length
      };

      const ordersHtml = orders.length === 0 
        ? '<div class="order-card">У вас пока нет заказов</div>'
        : orders.map(order => `
            <div class="order-card">
              <div class="order-header">
                <span class="order-id">Заказ #${order.id}</span>
                <span class="order-status ${getStatusClass(order.status)}">${getStatusText(order.status)}</span>
              </div>
              <div class="order-details">
                <span>${new Date(order.date).toLocaleDateString('ru-RU')}</span>
                <span class="order-price">${formatPrice(order.total)}</span>
              </div>
              ${order.code ? `
                <div style="margin-top: 10px; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 8px; font-family: monospace;">
                  Код: ${order.code}
                </div>
              ` : ''}
            </div>
          `).join('');

      content.innerHTML = `
        <div class="profile-header">
          <div class="profile-avatar">
            ${avatarHtml}
          </div>
          <div class="profile-info">
            <div class="profile-name">${user.username || 'Пользователь'}</div>
            <div class="profile-id">ID: ${user.id}</div>
            ${user.tgId ? `<div class="profile-id">TG: ${user.tgId}</div>` : ''}
          </div>
          <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value">${stats.total}</div>
            <div class="stat-label">Всего заказов</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${stats.completed}</div>
            <div class="stat-label">Выполнено</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${stats.waiting}</div>
            <div class="stat-label">В обработке</div>
          </div>
        </div>

        <div class="section-title">История заказов</div>
        <div class="orders-list">
          ${ordersHtml}
        </div>
      `;
    }

    // Показать загрузку
    function showLoading() {
      document.getElementById('profileContent').innerHTML = `
        <div class="loading">
          <div class="loading-spinner"></div>
          Загрузка профиля...
        </div>
      `;
    }

    // Показать ошибку
    function showError(message) {
      document.getElementById('profileContent').innerHTML = `
        <div class="error-message">
          ❌ ${message}
          <div style="margin-top: 15px;">
            <button onclick="location.reload()" class="logout-btn" style="margin-right: 10px;">Повторить</button>
            <a href="index.html" class="logout-btn" style="text-decoration: none;">На главную</a>
          </div>
        </div>
      `;
    }

    // Загрузка профиля
    async function loadProfile() {
      const user = loadUser();
      
      if (!user || !user.id) {
        window.location.href = 'reg_log.html';
        return;
      }

      showLoading();

      try {
        // ПРОСТОЙ GET-запрос с userId
        const response = await fetch(`${API_URL}/api/auth/profile?userId=${user.id}`, {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        });

        const data = await response.json();

        if (data.success) {
          const updatedUser = { ...user, ...data.user };
          saveUser(updatedUser);
          renderProfile(data.user, data.orders || []);
        } else {
          showError('Ошибка загрузки профиля: ' + (data.error || 'Неизвестная ошибка'));
        }
      } catch (error) {
        console.error('Ошибка:', error);
        showError('Ошибка соединения с сервером');
      }
    }

    // Проверка техперерыва
    (function checkMaintenance() {
      const urlParams = new URLSearchParams(window.location.search);
      const adminBypass = urlParams.get('admin_bypass');
      
      if (adminBypass) {
        sessionStorage.setItem('admin_bypass_active', 'true');
        return;
      }
      
      if (sessionStorage.getItem('admin_bypass_active') === 'true') {
        return;
      }
      
      fetch(`${API_URL}/api/maintenance-status`)
        .then(r => r.json())
        .then(data => {
          if (data.maintenance) {
            window.location.href = 'working';
          }
        })
        .catch(() => {});
    })();

    // Запуск
    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
