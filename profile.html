<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Мой профиль - Duck Shop</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(180deg, #0b3c91 0%, #1565c0 55%, #42a5f5 100%);
  overflow-x: hidden;
}

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  opacity: 0;
  transform: translateY(16px);
  pointer-events: none;
  transition: opacity .35s ease, transform .35s ease;
  padding: 20px;
  box-sizing: border-box;
  overflow-y: auto;
}

.screen.active {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.screen.leaving {
  opacity: 0;
  transform: translateY(-40px);
}

#loading .sticker {
  width: 200px;
  height: 200px;
  margin: auto;
}

#loading .title {
  color: white;
  font-size: 24px;
  font-weight: 800;
  text-align: center;
  margin-top: 20px;
}

.profile-screen {
  padding: 0;
}

.profile-header {
  width: 100%;
  padding: 30px 20px;
  text-align: center;
  background: linear-gradient(180deg, #0b3c91, #124fa5);
  color: white;
  box-sizing: border-box;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  position: relative;
}

.profile-avatar {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  margin: 0 auto 20px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
  transition: transform 0.2s ease;
  border: 4px solid rgba(255,255,255,0.3);
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

.profile-avatar:hover {
  transform: scale(1.05);
}

.profile-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.profile-avatar .avatar-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  font-size: 48px;
  color: white;
  font-weight: 900;
  border-radius: 50%;
}

.edit-avatar-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0,0,0,0.7);
  color: white;
  padding: 8px;
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  backdrop-filter: blur(4px);
  opacity: 0;
  transition: opacity 0.2s ease;
}

.profile-avatar:hover .edit-avatar-overlay {
  opacity: 1;
}

.profile-name {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 8px;
  cursor: pointer;
  display: inline-block;
  padding: 8px 20px;
  border-radius: 30px;
  transition: background 0.2s ease;
}

.profile-name:hover {
  background: rgba(255,255,255,0.1);
}

.profile-id {
  font-size: 16px;
  color: rgba(255,255,255,0.9);
  margin-bottom: 5px;
  word-break: break-word;
  padding: 0 20px;
}

.profile-email {
  font-size: 15px;
  color: rgba(255,255,255,0.8);
  margin-bottom: 15px;
  word-break: break-word;
}

.profile-username {
  font-size: 15px;
  color: rgba(255,255,255,0.7);
  margin-bottom: 15px;
}

.telegram-link-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.15);
  border: 2px solid rgba(255,255,255,0.3);
  color: white;
  padding: 10px 20px;
  border-radius: 40px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  margin-top: 10px;
}

.telegram-link-btn:hover {
  background: rgba(255,255,255,0.25);
  border-color: rgba(255,255,255,0.5);
  transform: translateY(-2px);
}

.telegram-link-btn.linked {
  background: rgba(76, 175, 80, 0.3);
  border-color: #4CAF50;
}

.telegram-link-btn svg {
  width: 20px;
  height: 20px;
  fill: white;
}

.profile-content {
  flex: 1;
  width: 100%;
  padding: 20px;
  box-sizing: border-box;
  overflow-y: auto;
  padding-bottom: 110px;
}

.profile-section {
  background: rgba(255,255,255,0.1);
  border-radius: 24px;
  padding: 20px;
  margin-bottom: 20px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
}

.section-title {
  color: white;
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.section-title span:last-child {

  color: rgba(255,255,255,0.8);
  font-weight: 600;
  background: rgba(255,255,255,0.1);
  padding: 4px 12px;
  border-radius: 20px;
}

.orders-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.order-item {
  background: rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 16px;
  transition: all 0.2s ease;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.05);
}

.order-item:hover {
  background: rgba(255,255,255,0.12);
  transform: translateY(-2px);
  border-color: rgba(255,255,255,0.15);
}

.order-item.grayed {
  background: rgba(150, 150, 150, 0.15);
  opacity: 0.7;
}

.order-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  align-items: flex-start;
  gap: 10px;
}

.order-id {
  color: #ffd700;
  font-weight: 700;
  font-size: 16px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.order-date {
  color: rgba(255,255,255,0.7);
  font-size: 14px;
  white-space: nowrap;
  flex-shrink: 0;
}

.order-details {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
}

.order-total {
  color: white;
  font-weight: 700;
  font-size: 18px;
}

.order-status {
  padding: 6px 16px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #ffffff;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
  min-width: 100px;
  text-align: center;
}

.order-status.completed {
  background: rgba(76, 175, 80, 0.4);
}

.order-status.canceled {
  background: rgba(255, 107, 107, 0.4);
}

.order-status.manyback,
.order-status.refund {
  background: rgba(0, 0, 0, 0.6);
}

.order-status.waiting,
.order-status.pending {
  background: rgba(255, 255, 255, 0.2);
}

.sticker-small {
  width: 120px;
  height: 120px;
  margin: 0 auto 20px;
}

.no-orders {
  text-align: center;
  color: rgba(255,255,255,0.8);
  padding: 30px 0;
}

.no-orders-text {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 8px;
}

.no-orders-subtext {
  font-size: 14px;
  color: rgba(255,255,255,0.6);
}

.profile-actions {
  display: flex;
  gap: 12px;
  margin-top: 30px;
  margin-bottom: 30px;
}

.profile-btn {
  flex: 1;
  height: 54px;
  border-radius: 16px;
  border: none;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.profile-btn:active {
  transform: scale(0.97);
}

.profile-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 25px rgba(0,0,0,0.4);
}

.btn-logout {
  background: rgba(255,255,255,0.15);
  color: white;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);
}

.btn-back {
  background: white;
  color: #0b3c91;
}

.error-screen {
  text-align: center;
  color: white;
  padding: 40px 20px;
}

.error-icon {
  width: 80px;
  height: 80px;
  margin: 0 auto 20px;
  background-image: url('https://i.imgur.com/TdWbh8z.png');
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  opacity: 0.8;
}

.error-title {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 10px;
}

.error-text {
  font-size: 16px;
  color: rgba(255,255,255,0.8);
  margin-bottom: 30px;
  max-width: 400px;
}

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10001;
  backdrop-filter: blur(8px);
}

.modal-container {
  background: linear-gradient(180deg, #1565c0, #0b3c91);
  border-radius: 32px;
  width: 90%;
  max-width: 450px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 28px;
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 25px 50px rgba(0,0,0,0.5);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
  color: white;
}

.modal-header h2 {
  margin: 0;
  font-size: 24px;
  font-weight: 800;
  color: white;
}

.modal-close {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.2);
  font-size: 24px;
  cursor: pointer;
  color: white;
  padding: 0;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: all 0.2s ease;
}

.modal-close:hover {
  background: rgba(255,255,255,0.25);
  transform: rotate(90deg);
}

.modal-content {
  display: flex;
  flex-direction: column;
  gap: 25px;
}

.edit-section {
  background: rgba(255,255,255,0.08);
  border-radius: 24px;
  padding: 20px;
  border: 1px solid rgba(255,255,255,0.1);
}

.edit-section-title {
  font-size: 18px;
  font-weight: 700;
  color: white;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.edit-section-title::before {
  content: '';
  width: 4px;
  height: 20px;
  background: #ffd700;
  border-radius: 2px;
  display: inline-block;
}

.avatar-edit-container {
  display: flex;
  align-items: center;
  gap: 20px;
}

.current-avatar {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  overflow: hidden;
  background: rgba(255,255,255,0.1);
  border: 3px solid rgba(255,255,255,0.3);
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.current-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.avatar-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.btn {
  padding: 12px 18px;
  border-radius: 16px;
  border: none;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s ease;
}

.btn-primary {
  background: #ffd700;
  color: #0b3c91;
  box-shadow: 0 8px 20px rgba(255, 215, 0, 0.3);
}

.btn-primary:hover {
  background: #ffed4a;
  transform: translateY(-2px);
  box-shadow: 0 12px 25px rgba(255, 215, 0, 0.4);
}

.btn-secondary {
  background: rgba(255,255,255,0.15);
  color: white;
  border: 1px solid rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
}

.btn-secondary:hover {
  background: rgba(255,255,255,0.25);
  transform: translateY(-2px);
}

.input-group {
  display: flex;
  gap: 10px;
  align-items: center;
}

.edit-input {
  flex: 1;
  padding: 14px 18px;
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 16px;
  font-size: 16px;
  outline: none;
  transition: all 0.2s ease;
  background: rgba(255,255,255,0.08);
  color: white;
  font-weight: 500;
}

.edit-input::placeholder {
  color: rgba(255,255,255,0.5);
}

.edit-input:focus {
  border-color: #ffd700;
  background: rgba(255,255,255,0.12);
}

.input-hint {
  font-size: 13px;
  color: rgba(255,255,255,0.6);
  margin-top: 10px;
  padding-left: 5px;
}

.telegram-status {
  background: rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1px solid rgba(255,255,255,0.1);
}

.telegram-status.linked {
  background: rgba(76, 175, 80, 0.15);
  border-color: rgba(76, 175, 80, 0.3);
}

.telegram-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.telegram-name {
  font-weight: 700;
  font-size: 16px;
  color: white;
}

.telegram-username {
  font-size: 14px;
  color: rgba(255,255,255,0.7);
}

.vk-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(0, 119, 255, 0.2);
  border: 1px solid rgba(0, 119, 255, 0.4);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 13px;
  color: white;
  margin-left: 10px;
}

.vk-badge svg {
  width: 16px;
  height: 16px;
  fill: white;
}

@media (max-width: 768px) {
  .profile-content {
    padding: 15px;
    padding-bottom: 110px;
  }
  .profile-section {
    padding: 16px;
  }
  .order-item {
    padding: 14px;
  }
  .profile-actions {
    flex-direction: column;
  }
  .avatar-edit-container {
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .avatar-actions {
    width: 100%;
  }
  .sticker-small {
    width: 100px;
    height: 100px;
  }
}

@media (max-width: 480px) {
  .profile-header {
    padding: 20px 15px;
  }
  .profile-avatar {
    width: 100px;
    height: 100px;
  }
  .profile-avatar .avatar-placeholder {
    font-size: 40px;
  }
  .profile-name {
    font-size: 24px;
  }
  .profile-content {
    padding: 12px;
    padding-bottom: 105px;
  }
  .order-id {
    font-size: 14px;
  }
  .order-total {
    font-size: 16px;
  }
  .order-status {
    font-size: 12px;
    padding: 4px 12px;
    min-width: 80px;
  }
}

.mobile-nav {
  position: fixed;
  bottom: 16px;
  left: 16px;
  right: 16px;
  display: none;
  align-items: center;
  justify-content: space-around;
  background: rgba(65, 105, 225, 0.3);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);

  .mobile-nav {

}

}

.mobile-nav .cart-badge-mobile {

.mobile-nav .cart-badge-mobile.show {

<body>

<div id="loading" class="screen active">
  <div class="sticker" id="loadingAnim"></div>
  <div class="title">Загрузка профиля...</div>
</div>

<div id="profile" class="screen profile-screen">
  <div class="profile-header">
    <div class="profile-avatar" id="profileAvatar" onclick="openEditModal()">
      <div class="edit-avatar-overlay">Изменить фото</div>
    </div>
    <div class="profile-name" id="profileName" onclick="openEditModal()">
      Пользователь
      <span class="vk-badge" id="vkBadge" style="display: none;">
        <svg viewBox="0 0 24 24">
          <path d="M15.07 2H8.93C3.33 2 2 3.33 2 8.93v6.14C2 20.67 3.33 22 8.93 22h6.14c5.6 0 6.93-1.33 6.93-6.93V8.93C22 3.33 20.67 2 15.07 2zm3.54 14.2h-1.46c-.56 0-.73-.43-1.73-1.44-.86-.86-1.24-.98-1.46-.98-.3 0-.38.08-.38.47v1.23c0 .34-.11.54-1.02.54-1.5 0-3.17-.92-4.35-2.64-1.8-2.51-2.29-4.4-2.29-4.79 0-.2.08-.39.47-.39h1.46c.35 0 .48.16.61.54.68 1.83 1.8 3.43 2.27 3.43.17 0 .25-.08.25-.52v-1.82c-.06-.96-.56-1.04-.56-1.39 0-.16.13-.3.3-.3h2.3c.26 0 .35.14.35.45v2.41c0 .26.11.35.18.35.15 0 .27-.09.53-.35 1.01-1.14 1.72-2.89 1.72-2.89.1-.17.23-.26.44-.26h1.46c.45 0 .55.23.45.54-.2.9-2.13 3.24-2.13 3.24-.16.22-.21.33 0 .59.16.21.7.68 1.06 1.1.65.75 1.15 1.38 1.15 1.8.01.41-.3.6-.74.6z"/>
        </svg>
        VK ID
      </span>
    </div>
    <div class="profile-id" id="profileId"></div>
    <div class="profile-email" id="profileEmail"></div>
    <div class="profile-username" id="profileUsername"></div>
    <button class="telegram-link-btn" id="telegramLinkBtn" onclick="openTelegramLink()">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
      </svg>
      <span id="telegramLinkText">Привязать Telegram</span>
    </button>
  </div>

  <div class="profile-content">
    <div class="profile-section">
      <div class="section-title">
        <span>История заказов</span>
        <span id="ordersCount">0</span>
      </div>
      <div class="orders-list" id="ordersList"></div>
    </div>

    <div class="profile-actions">
