<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль - Duck Shop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .profile-card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
      font-weight: bold;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-info h2 {
      font-size: 24px;
      margin-bottom: 5px;
      color: #333;
    }

    .user-info p {
      color: #666;
      font-size: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 5px;
    }

    .stat-label {
      color: #666;
      font-size: 14px;
    }

    .orders-title {
      font-size: 20px;
      margin-bottom: 20px;
      color: #333;
    }

    .order-card {
      background: #f8f9fa;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
      transition: transform 0.2s;
    }

    .order-card:hover {
      transform: translateY(-2px);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .order-id {
      font-weight: bold;
      color: #333;
    }

    .order-status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-completed { background: #d4edda; color: #155724; }
    .status-waiting { background: #fff3cd; color: #856404; }
    .status-manyback { background: #f8d7da; color: #721c24; }

    .order-details {
      display: flex;
      justify-content: space-between;
      color: #666;
      font-size: 14px;
    }

    .order-price {
      font-weight: bold;
      color: #28a745;
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: white;
      font-size: 18px;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      background: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }

    .back-button {
      display: inline-block;
      padding: 12px 24px;
      background: white;
      color: #667eea;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      margin-bottom: 20px;
      transition: transform 0.2s;
    }

    .back-button:hover {
      transform: translateY(-2px);
    }

    .logout-button {
      padding: 10px 20px;
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    .logout-button:hover {
      background: #c82333;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-button">← На главную</a>
    
    <div id="profileContent">
      <!-- Здесь будет отображаться профиль -->
    </div>
  </div>

  <script>
    const API_URL = 'https://duck-shop-sever.onrender.com';
    const USER_KEY = 'duck_user_v1';
    const SITE_URL = 'https://shopdxs.ru';

    // Загрузка пользователя из localStorage
    function loadUser() {
      try {
        const userData = localStorage.getItem(USER_KEY);
        return userData ? JSON.parse(userData) : null;
      } catch (e) {
        return null;
      }
    }

    // Сохранение пользователя
    function saveUser(user) {
      try {
        localStorage.setItem(USER_KEY, JSON.stringify(user));
      } catch (e) {}
    }

    // Выход из аккаунта
    function logout() {
      localStorage.removeItem(USER_KEY);
      window.location.href = 'index.html';
    }

    // Форматирование цены
    function formatPrice(price) {
      return new Intl.NumberFormat('ru-RU').format(price) + ' ₽';
    }

    // Статус заказа на русском
    function getStatusText(status) {
      const statuses = {
        'new': '🆕 Новый',
        'pending': '⏳ Ожидает оплаты',
        'confirmed': '✅ Оплачен',
        'waiting': '⏳ В обработке',
        'waiting_code_request': '⏳ Ожидает код',
        'completed': '🎉 Выполнен',
        'canceled': '❌ Отменен',
        'manyback': '💰 Возврат'
      };
      return statuses[status] || status;
    }

    // Класс статуса для стилей
    function getStatusClass(status) {
      if (status === 'completed') return 'status-completed';
      if (status === 'waiting' || status === 'waiting_code_request') return 'status-waiting';
      if (status === 'manyback') return 'status-manyback';
      return '';
    }

    // Рендеринг профиля
    function renderProfile(user, orders = []) {
      const content = document.getElementById('profileContent');
      
      const avatarHtml = user.avatarUrl 
        ? `<img src="${user.avatarUrl}" alt="avatar">`
        : `<span>${user.username ? user.username[0].toUpperCase() : '?'}</span>`;

      let ordersHtml = '';
      if (orders.length === 0) {
        ordersHtml = '<div class="order-card">У вас пока нет заказов</div>';
      } else {
        ordersHtml = orders.map(order => `
          <div class="order-card">
            <div class="order-header">
              <span class="order-id">Заказ #${order.id}</span>
              <span class="order-status ${getStatusClass(order.status)}">${getStatusText(order.status)}</span>
            </div>
            <div class="order-details">
              <span>${new Date(order.date).toLocaleDateString('ru-RU')}</span>
              <span class="order-price">${formatPrice(order.total)}</span>
            </div>
            ${order.code ? `<div style="margin-top: 10px; padding: 10px; background: #e9ecef; border-radius: 8px; font-family: monospace;">Код: ${order.code}</div>` : ''}
          </div>
        `).join('');
      }

      content.innerHTML = `
        <div class="profile-card">
          <div class="profile-header">
            <div class="avatar">
              ${avatarHtml}
            </div>
            <div class="user-info">
              <h2>${user.username || 'Пользователь'}</h2>
              <p>ID: ${user.id}</p>
              ${user.tgId ? `<p>Telegram ID: ${user.tgId}</p>` : ''}
              <button class="logout-button" onclick="logout()">Выйти</button>
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value">${orders.length}</div>
              <div class="stat-label">Всего заказов</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${orders.filter(o => o.status === 'completed').length}</div>
              <div class="stat-label">Выполнено</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${orders.filter(o => o.status === 'waiting').length}</div>
              <div class="stat-label">В обработке</div>
            </div>
          </div>

          <div class="orders-title">История заказов</div>
          <div id="ordersList">
            ${ordersHtml}
          </div>
        </div>
      `;
    }

    // Показать загрузку
    function showLoading() {
      document.getElementById('profileContent').innerHTML = `
        <div class="loading">
          <div class="loading-spinner"></div>
          Загрузка профиля...
        </div>
      `;
    }

    // Показать ошибку
    function showError(message) {
      document.getElementById('profileContent').innerHTML = `
        <div class="error-message">
          ❌ ${message}
        </div>
        <div style="text-align: center; margin-top: 20px;">
          <button onclick="location.reload()" class="back-button">Повторить</button>
          <a href="index.html" class="back-button">На главную</a>
        </div>
      `;
    }

    // Загрузка профиля с сервера
    async function loadProfile() {
      // Проверяем есть ли пользователь в localStorage
      const user = loadUser();
      
      if (!user || !user.id) {
        console.log('Пользователь не найден, редирект на страницу входа');
        window.location.href = 'reg_log.html';
        return;
      }

      showLoading();

      try {
        // ПРОСТОЙ И РАБОЧИЙ ВАРИАНТ - GET запрос с userId в URL
        const response = await fetch(`${API_URL}/api/auth/profile?userId=${user.id}`, {
          method: 'GET',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          }
        });

        const data = await response.json();

        if (data.success) {
          // Обновляем данные пользователя в localStorage
          const updatedUser = { ...user, ...data.user };
          saveUser(updatedUser);
          
          // Рендерим профиль
          renderProfile(data.user, data.orders || []);
        } else {
          console.error('Ошибка сервера:', data.error);
          showError('Не удалось загрузить профиль: ' + (data.error || 'Неизвестная ошибка'));
        }
      } catch (error) {
        console.error('Ошибка загрузки профиля:', error);
        showError('Ошибка соединения с сервером');
      }
    }

    // Проверка техперерыва (как на всех страницах)
    (function checkMaintenance() {
      const urlParams = new URLSearchParams(window.location.search);
      const adminBypass = urlParams.get('admin_bypass');
      
      if (adminBypass) {
        sessionStorage.setItem('admin_bypass_active', 'true');
        return;
      }
      
      if (sessionStorage.getItem('admin_bypass_active') === 'true') {
        return;
      }
      
      fetch(`${API_URL}/api/maintenance-status`)
        .then(r => r.json())
        .then(data => {
          if (data.maintenance) {
            window.location.href = 'working';
          }
        })
        .catch(() => {});
    })();

    // Запускаем загрузку профиля при загрузке страницы
    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
