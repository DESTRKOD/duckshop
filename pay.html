<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оплата заказа | Duck Shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/png" href="https://i.imgur.com/S4nWZZp.png">
    <link rel="shortcut icon" type="image/png" href="https://i.imgur.com/S4nWZZp.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/YOUhVyG.png">
    <meta name="theme-color" content="#0b3c91">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #0b3c91 0%, #1565c0 55%, #42a5f5 100%);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 32px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sticker {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
        }

        .title {
            font-size: 26px;
            font-weight: 800;
            color: white;
            text-align: center;
            margin-bottom: 8px;
        }

        .order-id {
            font-size: 18px;
            font-weight: 700;
            color: #ffd966;
            text-align: center;
            margin-bottom: 24px;
            background: rgba(255,255,255,0.1);
            padding: 8px 20px;
            border-radius: 40px;
            display: inline-block;
        }

        .payment-details {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 24px;
            margin: 20px 0;
        }

        .method-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .method-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .method-icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .method-name {
            font-size: 20px;
            font-weight: 700;
            color: white;
        }

        .detail-row {
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .detail-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .detail-label {
            font-size: 13px;
            opacity: 0.7;
            color: white;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-size: 18px;
            font-weight: 700;
            color: white;
            word-break: break-all;
        }

        .detail-value.small {
            font-size: 16px;
            font-family: monospace;
        }

        .note {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin: 16px 0;
            text-align: center;
        }

        .paid-button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: 800;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .paid-button:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .paid-button:active {
            transform: translateY(1px);
        }

        .paid-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 16px;
            }
            .sticker {
                width: 150px;
                height: 150px;
            }
            .title {
                font-size: 22px;
            }
            .method-icon {
                width: 40px;
                height: 40px;
            }
            .method-icon img {
                width: 28px;
                height: 28px;
            }
            .method-name {
                font-size: 18px;
            }
            .detail-value {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="sticker" id="lottie-animation"></div>
    <div class="title">Оплатите ваш заказ</div>
    <div class="order-id" id="orderIdDisplay"></div>

    <div class="payment-details" id="paymentDetails"></div>

    <div class="note">После оплаты нажмите кнопку ниже</div>
    <button class="paid-button" id="paidButton">Я оплатил</button>
</div>

<script>
    // КОНСТАНТЫ ДЛЯ ИКОНОК СПОСОБОВ ОПЛАТЫ
    const METHOD_ICONS = {
        sber: 'https://i.imgur.com/sber_icon.png',
        alfa: 'https://i.imgur.com/alfa_icon.png',
        ozon: 'https://i.imgur.com/ozon_icon.png',
        alfa_sbp: 'https://i.imgur.com/alfa_sbp.png',
        ozon_sbp: 'https://i.imgur.com/ozon_sbp.png',
        auto: 'https://i.imgur.com/auto_icon.png'
    };
    
    const orderData = localStorage.getItem('pending_order');
    if (!orderData) {
        alert('Данные заказа не найдены');
        window.location.href = '/';
    }
    const order = JSON.parse(orderData);
    const orderId = order.orderId || 'Неизвестный номер';
    
    document.getElementById('orderIdDisplay').innerText = `Заказ #${orderId}`;
    
    const urlParams = new URLSearchParams(window.location.search);
    const method = urlParams.get('method');
    
    const paymentDetailsMap = {
        sber: {
            name: 'Сбербанк',
            icon: METHOD_ICONS.sber,
            details: [
                { label: 'Номер карты', value: '4276 3800 1234 5678', small: true },
                { label: 'Получатель', value: 'Иванов Иван Иванович' }
            ]
        },
        alfa: {
            name: 'Альфа Банк',
            icon: METHOD_ICONS.alfa,
            details: [
                { label: 'Номер карты', value: '5486 7890 1234 5678', small: true },
                { label: 'Получатель', value: 'Петров Петр Петрович' }
            ]
        },
        ozon: {
            name: 'Озон Банк',
            icon: METHOD_ICONS.ozon,
            details: [
                { label: 'Номер карты', value: '2202 1234 5678 9012', small: true },
                { label: 'Получатель', value: 'Сидоров Сидор Сидорович' }
            ]
        },
        alfa_sbp: {
            name: 'Альфа Банк (СБП)',
            icon: METHOD_ICONS.alfa_sbp,
            details: [
                { label: 'Номер телефона', value: '+7 999 123-45-67', small: true },
                { label: 'Получатель', value: 'Петров Петр Петрович' }
            ]
        },
        ozon_sbp: {
            name: 'Озон Банк (СБП)',
            icon: METHOD_ICONS.ozon_sbp,
            details: [
                { label: 'Номер телефона', value: '+7 999 765-43-21', small: true },
                { label: 'Получатель', value: 'Сидоров Сидор Сидорович' }
            ]
        },
        auto: {
            name: 'Автоматическая оплата',
            icon: METHOD_ICONS.auto,
            details: [
                { label: 'Статус', value: 'Временно недоступна' }
            ]
        }
    };
    
    const selected = paymentDetailsMap[method] || paymentDetailsMap.sber;
    
    lottie.loadAnimation({
        container: document.getElementById('lottie-animation'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: 'pay.json'
    });
    
    const detailsContainer = document.getElementById('paymentDetails');
    let html = `
        <div class="method-header">
            <div class="method-icon">
                <img src="${selected.icon}" alt="${selected.name}" onerror="this.style.display='none';this.parentElement.innerHTML='💳'">
            </div>
            <div class="method-name">${selected.name}</div>
        </div>
    `;
    selected.details.forEach(detail => {
        html += `
            <div class="detail-row">
                <div class="detail-label">${detail.label}</div>
                <div class="detail-value ${detail.small ? 'small' : ''}">${detail.value}</div>
            </div>
        `;
    });
    html += `
        <div class="detail-row">
            <div class="detail-label">СУММА К ОПЛАТЕ</div>
            <div class="detail-value">${(order.total || 0).toLocaleString()} ₽</div>
        </div>
    `;
    detailsContainer.innerHTML = html;
    
    const paidBtn = document.getElementById('paidButton');
    paidBtn.addEventListener('click', async () => {
        paidBtn.disabled = true;
        const originalText = paidBtn.innerHTML;
        paidBtn.innerHTML = '<span class="loading-spinner"></span> Отправка...';
        
        const paymentData = {
            orderId: order.orderId || orderId,
            total: order.total,
            items: order.items,
            paymentMethod: method,
            methodName: selected.name,
            timestamp: new Date().toISOString()
        };
        
        try {
            const response = await fetch('/api/payment-confirmation', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(paymentData)
            });
            
            const result = await response.json();
            
            if (result.success) {
                window.location.href = `/waiting.html?order=${order.orderId || orderId}`;
            } else {
                alert('Ошибка при отправке подтверждения. Пожалуйста, обратитесь в поддержку.');
                paidBtn.disabled = false;
                paidBtn.innerHTML = originalText;
            }
        } catch (error) {
            console.error('Ошибка:', error);
            alert('Ошибка соединения. Попробуйте позже.');
            paidBtn.disabled = false;
            paidBtn.innerHTML = originalText;
        }
    });
</script>
</body>
</html>
