<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Оплата заказа | Duck Shop</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0b3c91 0%, #1e2a6e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 24px 20px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .animation-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 10px;
        }

        .title {
            color: white;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .order-id {
            color: #ffd966;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .payment-details {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .detail-row {
            margin-bottom: 12px;
            color: white;
        }

        .detail-label {
            font-size: 14px;
            opacity: 0.7;
            display: block;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 18px;
            font-weight: 600;
            word-break: break-all;
        }

        .detail-value.small {
            font-size: 14px;
            font-family: monospace;
        }

        .note {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            margin: 16px 0;
            text-align: center;
        }

        .paid-button {
            background: #2196f3;
            color: white;
            font-size: 18px;
            font-weight: 700;
            padding: 16px;
            border: none;
            border-radius: 40px;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin-top: 10px;
        }

        .paid-button:hover {
            background: #1976d2;
            transform: translateY(-2px);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="animation-container" id="lottie-animation"></div>
    <div class="title">Оплатите ваш заказ</div>
    <div class="order-id" id="orderIdDisplay"></div>

    <div class="payment-details" id="paymentDetails">
        <!-- Реквизиты будут вставлены динамически -->
    </div>

    <div class="note">После оплаты нажмите кнопку ниже</div>
    <button class="paid-button" id="paidButton">Я оплатил</button>
</div>

<script>
    // Получаем данные заказа
    const orderData = localStorage.getItem('pending_order');
    if (!orderData) {
        alert('Данные заказа не найдены');
        window.location.href = '/';
    }
    const order = JSON.parse(orderData);
    const orderId = order.orderId || 'Неизвестный номер';
    
    // Отображаем номер заказа
    document.getElementById('orderIdDisplay').innerText = `Заказ #${orderId}`;
    
    // Получаем выбранный метод оплаты
    const urlParams = new URLSearchParams(window.location.search);
    const method = urlParams.get('method');
    
    // Константы реквизитов для каждого банка
    const paymentDetailsMap = {
        sber: {
            name: 'Сбербанк',
            details: [
                { label: 'Номер карты', value: '4276 3800 1234 5678' },
                { label: 'Получатель', value: 'Иванов Иван Иванович' }
            ]
        },
        alfa: {
            name: 'Альфа Банк',
            details: [
                { label: 'Номер карты', value: '5486 7890 1234 5678' },
                { label: 'Получатель', value: 'Петров Петр Петрович' }
            ]
        },
        ozon: {
            name: 'Озон Банк',
            details: [
                { label: 'Номер карты', value: '2202 1234 5678 9012' },
                { label: 'Получатель', value: 'Сидоров Сидор Сидорович' }
            ]
        },
        alfa_sbp: {
            name: 'Альфа Банк (СБП)',
            details: [
                { label: 'Номер телефона', value: '+7 999 123-45-67' },
                { label: 'Получатель', value: 'Петров Петр Петрович' }
            ]
        },
        ozon_sbp: {
            name: 'Озон Банк (СБП)',
            details: [
                { label: 'Номер телефона', value: '+7 999 765-43-21' },
                { label: 'Получатель', value: 'Сидоров Сидор Сидорович' }
            ]
        }
    };
    
    const selected = paymentDetailsMap[method] || paymentDetailsMap.sber;
    
    // Загрузка анимации
    lottie.loadAnimation({
        container: document.getElementById('lottie-animation'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: 'pay.json'
    });
    
    // Отображаем реквизиты
    const detailsContainer = document.getElementById('paymentDetails');
    let html = `<div class="detail-row"><div class="detail-label">Способ оплаты</div><div class="detail-value">${selected.name}</div></div>`;
    selected.details.forEach(detail => {
        html += `
            <div class="detail-row">
                <div class="detail-label">${detail.label}</div>
                <div class="detail-value ${detail.label.includes('телефон') ? 'small' : ''}">${detail.value}</div>
            </div>
        `;
    });
    html += `<div class="detail-row"><div class="detail-label">Сумма к оплате</div><div class="detail-value">${order.total?.toLocaleString() || 0} ₽</div></div>`;
    detailsContainer.innerHTML = html;
    
    // Обработка нажатия "Я оплатил"
    const paidBtn = document.getElementById('paidButton');
    paidBtn.addEventListener('click', async () => {
        // Блокируем кнопку и показываем загрузку
        paidBtn.disabled = true;
        const originalText = paidBtn.innerHTML;
        paidBtn.innerHTML = '<span class="loading"></span> Отправка...';
        
        // Формируем данные для отправки на сервер
        const paymentData = {
            orderId: order.orderId || orderId,
            total: order.total,
            items: order.items,
            paymentMethod: method,
            methodName: selected.name,
            timestamp: new Date().toISOString()
        };
        
        try {
            const response = await fetch('/api/payment-confirmation', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(paymentData)
            });
            
            const result = await response.json();
            
            if (result.success) {
                // Перенаправляем на страницу ожидания
                window.location.href = `/waiting.html?order=${order.orderId || orderId}`;
            } else {
                alert('Ошибка при отправке подтверждения. Пожалуйста, обратитесь в поддержку.');
                paidBtn.disabled = false;
                paidBtn.innerHTML = originalText;
            }
        } catch (error) {
            console.error('Ошибка:', error);
            alert('Ошибка соединения. Попробуйте позже.');
            paidBtn.disabled = false;
            paidBtn.innerHTML = originalText;
        }
    });
</script>
</body>
</html>
