<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <g fill="#1D1D1B">
    <!-- Левая наклонная ножка (А) -->
    <polygon points="90,400 250,100 285,115 125,400" />
    
    <!-- Горизонтальная перекладина (идет строго до зазора с дверью) -->
    <polygon points="185,295 292,295 292,322 185,322" />
    
    <!-- Верхняя перемычка (крыша) -->
    <polygon points="275,115 370,165 370,185 270,135" />
    
    <!-- Правая стойка (наличник) -->
    <polygon points="372,180 388,180 388,400 372,400" />
    
    <!-- Сама дверь -->
    <polygon points="295,185 355,200 355,450 295,465" />
  </g>
  
  <!-- Ручка двери (белая) -->
  <rect x="305" y="300" width="20" height="12" fill="#FFFFFF" />
</svg>
