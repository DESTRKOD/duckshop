<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <g fill="#1D1D1B">
    <!-- Левая наклонная ножка (А). Внимание: она сужается книзу! -->
    <polygon points="76,430 252,90 298,110 118,430" />
    
    <!-- Горизонтальная перекладина. Четко упирается в левую ножку и имеет зазор до двери. -->
    <polygon points="205,310 315,310 315,342 195,342" />
    
    <!-- Верхняя перемычка (крыша). Плавно переходит в правую стойку. -->
    <polygon points="290,100 395,155 395,178 285,122" />
    
    <!-- Правая стойка (наличник). -->
    <polygon points="398,172 415,180 415,430 398,430" />
    
    <!-- Сама дверь. -->
    <polygon points="315,180 370,195 370,455 315,465" />
  </g>
  
  <!-- Ручка двери (белая) -->
  <rect x="325" y="310" width="22" height="12" fill="#FFFFFF" />
</svg>
