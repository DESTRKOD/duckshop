<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <g fill="#1D1D1B">
    <!-- Левая наклонная ножка (А) -->
    <polygon points="90,390 255,95 285,110 125,390" />
    
    <!-- Горизонтальная перекладина (идет строго до двери) -->
    <polygon points="185,290 295,290 295,320 190,320" />
    
    <!-- Верхняя перемычка (крыша) -->
    <polygon points="275,105 370,160 370,177 270,123" />
    
    <!-- Правая стойка (наличник) с зазором от двери -->
    <polygon points="372,172 388,172 388,400 372,400" />
    
    <!-- Сама дверь -->
    <polygon points="295,175 355,190 355,440 295,455" />
  </g>
  
  <!-- Ручка двери (белая) -->
  <rect x="305" y="295" width="20" height="12" fill="#FFFFFF" />
</svg>
