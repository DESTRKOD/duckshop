<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" width="500" height="480">
  <g fill="#1D1D1B">
    <!-- Левая ножка А (короткое основание, почти параллельные стороны) -->
    <polygon points="70,455 130,455 265,95 195,45" />
    
    <!-- Горизонтальная перекладина -->
    <polygon points="160,295 300,295 300,330 145,330" />
    
    <!-- Верхняя перемычка (крыша), плавно уходит в правый наличник -->
    <polygon points="195,45 265,95 375,145 400,160 400,180 360,155 295,105 240,70" />
    
    <!-- Дверь (открытая, с лёгкой перспективой) -->
    <polygon points="300,110 370,145 370,455 300,470" />
    
    <!-- Правый тонкий наличник/стойка -->
    <polygon points="385,150 410,165 410,460 385,460" />
  </g>
  
  <!-- Белая ручка двери -->
  <rect x="320" y="290" width="26" height="15" rx="3" fill="#FFFFFF" />
</svg>
