<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Детали заказа - Duck Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(180deg, #0b3c91 0%, #1565c0 55%, #42a5f5 100%);
  overflow-x: hidden;
}

.order-header {
  width: 100%;
  padding: 16px 20px;
  font-size: 22px;
  font-weight: 900;
  color: #fff;
  background: linear-gradient(180deg, #0b3c91, #124fa5);
  display: flex;
  align-items: center;
  gap: 15px;
  box-sizing: border-box;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  position: sticky;
  top: 0;
  z-index: 100;
}

.back-arrow {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: rgba(255,255,255,.14);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s ease;
  color: white;
  font-size: 24px;
  font-weight: 900;
  text-decoration: none;
  flex-shrink: 0;
}

.back-arrow:hover {
  background: rgba(255,255,255,.20);
  transform: translateX(-2px);
}

.back-arrow:active {
  transform: scale(.95);
}

.order-title {
  font-size: 18px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

.order-content {
  padding: 20px;
  box-sizing: border-box;
  overflow-y: auto;
  height: calc(100% - 72px);
}

.order-section {
  background: rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 20px;
}

.section-title {
  color: white;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-title span:first-child {
  font-size: 20px;
}

.section-icon {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.section-icon img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: brightness(0) invert(1);
}

.order-info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
  margin-bottom: 20px;
}

.info-item {
  background: rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 15px;
}

.info-label {
  color: rgba(255,255,255,0.7);
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.info-value {
  color: white;
  font-size: 16px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.order-id-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
}

.order-id-text {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.copy-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  border-radius: 8px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
  flex-shrink: 0;
  margin-left: 8px;
}

.copy-btn:hover {
  background: rgba(255,255,255,0.2);
  transform: translateY(-1px);
}

.copy-btn:active {
  transform: scale(0.95);
}

.copy-btn.copied {
  background: rgba(76, 175, 80, 0.3);
}

.copy-icon {
  width: 16px;
  height: 16px;
  filter: brightness(0) invert(1);
}

.status-text {
  color: white;
  font-size: 14px;
  font-weight: 600;
  padding: 2px 0;
}

.order-items {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.order-item-card {
  background: rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 15px;
  display: grid;
  grid-template-columns: 70px 1fr auto;
  gap: 15px;
  align-items: center;
  transition: transform 0.2s ease, background 0.2s ease;
}

.order-item-card:hover {
  background: rgba(255,255,255,0.12);
  transform: translateY(-2px);
}

.item-image {
  width: 70px;
  height: 70px;
  border-radius: 14px;
  background: linear-gradient(180deg, #1b3fd6 0%, #2f6bff 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}

.item-image img {
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
  display: block;
}

.item-info {
  min-width: 0;
}

.item-name {
  color: white;
  font-weight: 900;
  font-size: 15px;
  line-height: 1.2;
  margin-bottom: 5px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.item-sub {
  color: rgba(255,255,255,0.7);
  font-size: 13px;
  font-weight: 600;
}

.item-quantity {
  color: white;
  font-size: 16px;
  font-weight: 800;
  text-align: center;
  min-width: 40px;
}

.order-total-section {
  background: rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 20px;
  margin-top: 20px;
}

.total-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.total-label {
  color: white;
  font-size: 16px;
  font-weight: 700;
}

.total-value {
  color: white;
  font-size: 20px;
  font-weight: 900;
}

.refund-row {
  background: rgba(0, 0, 0, 0.2);
  border-radius: 10px;
  padding: 10px;
  margin-top: 10px;
  border: 1px solid rgba(0, 0, 0, 0.4);
}

.refund-row .total-label {
  color: #ffffff;
}

.refund-row .total-value {
  color: #ffffff;
  font-weight: 800;
}

.final-total {
  border-top: 2px solid rgba(255,255,255,0.2);
  padding-top: 15px;
  margin-top: 15px;
}

.final-total .total-label {
  font-size: 18px;
}

.final-total .total-value {
  font-size: 24px;
  color: #ffd700;
}

.continue-button-container {
  margin-top: 25px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.1);
}

.continue-button {
  width: 100%;
  padding: 18px 24px;
  font-size: 18px;
  font-weight: 800;
  background: linear-gradient(135deg, #4fc3f7, #2196f3);
  color: white;
  border: none;
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  box-shadow: 0 8px 20px rgba(33, 150, 243, 0.3);
}

.continue-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 25px rgba(33, 150, 243, 0.4);
}

.continue-button:active {
  transform: translateY(0);
}

.continue-button:disabled {
  background: #cccccc;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none;
}

.button-icon {
  font-size: 20px;
}

.loading-screen, .error-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 40px;
  text-align: center;
  box-sizing: border-box;
}

.loading-anim {
  width: 150px;
  height: 150px;
  margin-bottom: 20px;
}

.error-icon {
  font-size: 60px;
  margin-bottom: 20px;
}

.loading-text, .error-title {
  color: white;
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 10px;
}

.error-text {
  color: rgba(255,255,255,0.8);
  font-size: 16px;
  margin-bottom: 30px;
  max-width: 400px;
}

.no-order {
  text-align: center;
  padding: 60px 20px;
}

.no-order-icon {
  font-size: 50px;
  margin-bottom: 20px;
  color: rgba(255,255,255,0.5);
}

.no-order-title {
  color: white;
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 10px;
}

.no-order-text {
  color: rgba(255,255,255,0.7);
  font-size: 16px;
  margin-bottom: 30px;
}

@media (max-width: 768px) {
  .order-header {
    padding: 14px 16px;
    font-size: 20px;
  }
  
  .back-arrow {
    width: 36px;
    height: 36px;
    font-size: 22px;
  }
  
  .order-content {
    padding: 16px;
  }
  
  .order-section {
    padding: 16px;
  }
  
  .order-info-grid {
    grid-template-columns: 1fr;
    gap: 12px;
  }
  
  .order-item-card {
    grid-template-columns: 60px 1fr auto;
    gap: 12px;
    padding: 12px;
  }
  
  .item-image {
    width: 60px;
    height: 60px;
  }
  
  .item-name {
    font-size: 14px;
  }
  
  .item-quantity {
    font-size: 15px;
  }
  
  .continue-button {
    padding: 16px 20px;
    font-size: 16px;
  }
}

@media (max-width: 480px) {
  .order-header {
    padding: 12px 14px;
  }
  
  .order-title {
    font-size: 16px;
  }
  
  .back-arrow {
    width: 34px;
    height: 34px;
    font-size: 20px;
  }
  
  .section-title {
    font-size: 16px;
  }
  
  .info-value {
    font-size: 15px;
  }
  
  .final-total .total-label {
    font-size: 16px;
  }
  
  .final-total .total-value {
    font-size: 20px;
  }
  
  .continue-button {
    font-size: 15px;
  }
}

@media (max-width: 360px) {
  .order-content {
    padding: 12px;
  }
  
  .order-section {
    padding: 14px;
    border-radius: 16px;
  }
  
  .order-item-card {
    grid-template-columns: 50px 1fr auto;
    gap: 10px;
    padding: 10px;
  }
  
  .item-image {
    width: 50px;
    height: 50px;
  }
  
  .item-name {
    font-size: 13px;
  }
}
</style>
</head>

<script>
const API_URL = 'https://duck-shop-sever.onrender.com';
const USER_KEY = 'duck_user_v1';

let currentUser = null;
let currentOrder = null;
let allProducts = [];
let orderStage = '';

function fmtRub(n) {
  if (!n) return '0 ₽';
  return `${n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ")} ₽`;
}



(function() {
  var urlParams = new URLSearchParams(window.location.search);
  var adminBypass = urlParams.get('admin_bypass');
  
  if (adminBypass) {
    sessionStorage.setItem('admin_bypass_active', 'true');
    sessionStorage.setItem('admin_bypass_key', adminBypass);
    window.history.replaceState({}, '', window.location.pathname);
    
    setTimeout(function() {
      var adminNote = document.createElement('div');
      adminNote.style.cssText = [
        'position: fixed',
        'bottom: 100px',
        'left: 50%',
        'transform: translateX(-50%)',
        'background: rgba(0,0,0,0.8)',
        'color: #ffd700',
        'padding: 8px 20px',
        'border-radius: 30px',
        'font-size: 14px',
        'font-weight: 600',
        'z-index: 10000',
        'backdrop-filter: blur(5px)',
        'border: 1px solid rgba(255,215,0,0.3)',
        'box-shadow: 0 4px 15px rgba(0,0,0,0.3)',
        'animation: fadeIn 0.3s ease'
      ].join(';');
      adminNote.textContent = '🔑 Режим администратора (техперерыв игнорируется)';
      document.body.appendChild(adminNote);
      
      setTimeout(function() {
        adminNote.style.opacity = '0';
        adminNote.style.transition = 'opacity 0.5s';
        setTimeout(function() {
          if (adminNote.parentNode) {
            adminNote.parentNode.removeChild(adminNote);
          }
        }, 500);
      }, 4000);
    }, 1000);
    
    return;
  }
  
  if (sessionStorage.getItem('admin_bypass_active') === 'true') {
    return;
  }
  
  var xhr = new XMLHttpRequest();
  xhr.open('GET', API_URL + '/api/maintenance-status', false);
  xhr.send();
  
  if (xhr.status === 200) {
    var data = JSON.parse(xhr.responseText);
    if (data.maintenance) {
      sessionStorage.setItem('attempted_page', window.location.pathname);
      window.location.href = 'working';
    }
  }
})();

(function() {
  var style = document.createElement('style');
  style.textContent = '@keyframes fadeIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}';
  document.head.appendChild(style);
})();


function formatDateTime(dateString) {
  if (!dateString) return 'Неизвестно';
  const date = new Date(dateString);
  return date.toLocaleDateString('ru-RU', {
    day: '2-digit',
    month: '2-digit',
    year: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit'
  });
}

function getStatusText(status) {
  const statusMap = {
    'new': 'Новый',
    'pending': 'Ожидает оплаты',
    'confirmed': 'Оплачен',
    'waiting': 'В работе',
    'waiting_code_request': 'В работе',
    'waiting_execution': 'В работе',
    'completed': 'Завершен',
    'canceled': 'Отменен',
    'failed': 'Неудачный',
    'manyback': 'Возврат'
  };
  return statusMap[status] || status;
}

function isActiveOrder(status) {
  return false;
}

function initCopyButton() {
  const copyBtn = document.getElementById('copyOrderIdBtn');
  const orderIdText = document.getElementById('orderId').textContent;
  
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(orderIdText);
      
      const originalHTML = copyBtn.innerHTML;
      copyBtn.innerHTML = '<img src="https://i.imgur.com/6eB3VQz.png" alt="Скопировано" class="copy-icon">';
      copyBtn.classList.add('copied');
      
      setTimeout(() => {
        copyBtn.innerHTML = originalHTML;
        copyBtn.classList.remove('copied');
      }, 2000);
      
    } catch (error) {
      console.error('Ошибка копирования:', error);
      const textArea = document.createElement('textarea');
      textArea.value = orderIdText;
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand('copy');
      document.body.removeChild(textArea);
      
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.classList.remove('copied');
      }, 2000);
    }
  });
}

function initLottieAnimation() {
  try {
    lottie.loadAnimation({
      container: document.getElementById('loadingAnim'),
      renderer: 'svg',
      loop: true,
      autoplay: true,
      path: 'https://assets10.lottiefiles.com/packages/lf20_puciaevh.json'
    });
  } catch (error) {
    console.log('Lottie анимация не загружена');
    document.getElementById('loadingAnim').innerHTML = '⏳';
  }
}

function showScreen(id) {
  const screens = ['loading', 'error', 'noOrder', 'content'];
  screens.forEach(screen => {
    document.getElementById(screen).style.display = 'none';
  });
  document.getElementById(id).style.display = id === 'content' ? 'block' : 'flex';
}

function showError(title, message) {
  document.getElementById('errorTitle').textContent = title;
  document.getElementById('errorText').textContent = message;
  showScreen('error');
}

async function loadProducts() {
  try {
    const response = await fetch(`${API_URL}/api/products`);
    const data = await response.json();
    
    if (data.success && data.products) {
      allProducts = data.products;
      console.log(`✅ Загружено ${allProducts.length} товаров`);
    } else {
      console.log('⚠️ Не удалось загрузить товары');
    }
  } catch (error) {
    console.error('❌ Ошибка загрузки товаров:', error);
  }
}

async function loadOrderData(orderId) {
  try {
    const response = await fetch(`${API_URL}/api/order-details/${orderId}`);
    const data = await response.json();
    
    if (data.success && data.order) {
      return data.order;
    }
    
    return null;
  } catch (error) {
    console.error('Ошибка загрузки заказа:', error);
    return null;
  }
}

async function determineOrderStage(orderId) {
  try {
    const response = await fetch(`${API_URL}/api/order-stage/${orderId}`);
    const data = await response.json();
    
    if (data.success) {
      return {
        stage: data.stage,
        redirectUrl: data.redirectUrl
      };
    }
    return null;
  } catch (error) {
    console.error('Ошибка определения этапа заказа:', error);
    return null;
  }
}

function loadUser() {
  try {
    const userData = localStorage.getItem(USER_KEY);
    if (userData) {
      return JSON.parse(userData);
    }
  } catch (error) {
    console.error('Ошибка загрузки пользователя:', error);
  }
  return null;
}

function displayOrder(order) {
  document.getElementById('orderTitle').textContent = `Заказ #${order.id}`;
  document.getElementById('orderId').textContent = order.id;
  
  document.getElementById('orderDate').textContent = formatDateTime(order.date);
  
  document.getElementById('orderEmail').textContent = order.email || 'Не указан';
  
  const statusText = getStatusText(order.status);
  document.getElementById('orderStatusText').textContent = statusText;
  
  initCopyButton();
  
  displayOrderItems(order.items || {});
  
  const subtotal = calculateSubtotal(order.items || {});
  const total = order.total || subtotal;
  
  document.getElementById('orderSubtotal').textContent = fmtRub(total);
  document.getElementById('orderTotal').textContent = fmtRub(total);
  
  if (order.refundAmount && order.refundAmount > 0) {
    document.getElementById('refundRow').style.display = 'block';
    document.getElementById('orderRefund').textContent = fmtRub(order.refundAmount);
  }
  
  showScreen('content');
}

function calculateSubtotal(items) {
  let subtotal = 0;
  for (const [productId, quantity] of Object.entries(items)) {
    const product = allProducts.find(p => p.id === productId);
    if (product) {
      subtotal += product.price * quantity;
    }
  }
  return subtotal;
}

function displayOrderItems(items) {
  const container = document.getElementById('orderItems');
  container.innerHTML = '';
  
  if (!items || Object.keys(items).length === 0) {
    container.innerHTML = `
      <div style="color: rgba(255,255,255,0.6); text-align: center; padding: 30px;">
        Нет информации о товарах
      </div>
    `;
    return;
  }
  
  for (const [productId, quantity] of Object.entries(items)) {
    const product = allProducts.find(p => p.id === productId);
    
    const itemHtml = `
      <div class="order-item-card">
        <div class="item-image">
          <img src="${product ? product.image_url : 'https://i.imgur.com/s4K0WIP.png'}" 
               alt="${product ? product.name : 'Товар'}">
        </div>
        <div class="item-info">
          <div class="item-name">${product ? product.name : `Товар ${productId}`}</div>
          <div class="item-sub">${fmtRub(product ? product.price : 0)} × ${quantity} шт.</div>
        </div>
        <div class="item-quantity">${quantity}</div>
      </div>
    `;
    
    container.innerHTML += itemHtml;
  }
}

async function setupContinueButton(orderId) {
  const continueContainer = document.getElementById('continueButtonContainer');
  const continueBtn = document.getElementById('continueOrderBtn');
  const continueText = document.getElementById('continueButtonText');
  
  const stageData = await determineOrderStage(orderId);
  
  if (!stageData || !stageData.stage || stageData.stage === 'completed' || stageData.stage === 'unknown' || stageData.stage === 'canceled' || stageData.stage === 'refund_processed') {
    continueContainer.style.display = 'none';
    return;
  }
  
  let buttonText = 'Вернуться к оформлению';
  
  switch(stageData.stage) {
    case 'email_required':
      buttonText = 'Ввести email →';
      break;
    case 'waiting_code_request':
      buttonText = 'Ожидание запроса кода →';
      break;
    case 'code_required':
      buttonText = 'Ввести код →';
      break;
    case 'waiting_execution':
      buttonText = 'Ожидание выполнения →';
      break;
    case 'support_needed':
      buttonText = 'Связь с поддержкой →';
      break;
  }
  
  continueText.textContent = buttonText;
  
  continueContainer.style.display = 'block';
  
  continueBtn.onclick = function() {
    window.location.href = stageData.redirectUrl;
  };
}

async function init() {
  currentUser = loadUser();
  
  if (!currentUser) {
    showError('Ошибка доступа', 'Вы не авторизованы');
    return;
  }
  
  const urlParams = new URLSearchParams(window.location.search);
  const orderId = urlParams.get('order');
  
  if (!orderId) {
    showScreen('noOrder');
    return;
  }
  
  await loadProducts();
  
  currentOrder = await loadOrderData(orderId);
  
  if (!currentOrder) {
    showScreen('noOrder');
    return;
  }
  
  displayOrder(currentOrder);
  
  await setupContinueButton(orderId);
}

document.addEventListener('DOMContentLoaded', () => {
  initLottieAnimation();
  
  setTimeout(() => {
    init();
  }, 500);
});
</script>
</body>
