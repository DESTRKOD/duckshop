<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Оплата не прошла | Duck Shop</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0b3c91 0%, #1e2a6e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 32px 24px;
            text-align: center;
        }

        .animation-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
        }

        .title {
            color: #ff6b6b;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .message {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .home-button {
            background: #2196f3;
            color: white;
            font-size: 18px;
            font-weight: 700;
            padding: 16px 24px;
            border: none;
            border-radius: 40px;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .home-button:hover {
            transform: translateY(-2px);
            background: #1976d2;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="animation-container" id="lottie-animation"></div>
    <div class="title">Оплата не прошла</div>
    <div class="message">
        Оплата не прошла, попробуйте снова или напишите в поддержку.<br>
        Возможно, проблема на стороне банка.
    </div>
    <a href="/" class="home-button">В главное меню</a>
</div>

<script>
    lottie.loadAnimation({
        container: document.getElementById('lottie-animation'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: 'bad_pay.json'
    });
</script>
</body>
</html>
