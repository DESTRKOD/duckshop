<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оплата не прошла | Duck Shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/png" href="https://i.imgur.com/S4nWZZp.png">
    <link rel="shortcut icon" type="image/png" href="https://i.imgur.com/S4nWZZp.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/YOUhVyG.png">
    <meta name="theme-color" content="#0b3c91">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #0b3c91 0%, #1565c0 55%, #42a5f5 100%);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 32px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .sticker {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            color: #ff6b6b;
            margin-bottom: 16px;
        }

        .message {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .order-number {
            font-size: 16px;
            font-weight: 600;
            color: #ffd966;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 40px;
            display: inline-block;
            margin-bottom: 32px;
        }

        .button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: 800;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .button:hover {
            background: #1976d2;
            transform: translateY(-2px);
        }

        .button:active {
            transform: translateY(1px);
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 16px;
            }
            .sticker {
                width: 150px;
                height: 150px;
            }
            .title {
                font-size: 24px;
            }
            .message {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="sticker" id="lottie-animation"></div>
    <div class="title">Оплата не прошла</div>
    <div class="message">
        Оплата не прошла, попробуйте снова или напишите в поддержку.<br>
        Возможно, проблема на стороне банка.
    </div>
    <div class="order-number" id="orderNumber"></div>
    <a href="/" class="button">В главное меню</a>
</div>

<script>
    lottie.loadAnimation({
        container: document.getElementById('lottie-animation'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: 'bad_pay.json'
    });
    
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('order');
    if (orderId) {
        document.getElementById('orderNumber').innerText = `Заказ #${orderId}`;
    } else {
        document.getElementById('orderNumber').style.display = 'none';
    }
</script>
</body>
</html>
